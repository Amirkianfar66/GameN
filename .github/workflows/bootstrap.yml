name: Workspace, frontend and backend checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: node --test tests/tooling/ci-check-plan.test.mjs
      - id: plan
        run: node scripts/ci-check-plan.mjs

  verify:
    needs: changes
    runs-on: ubuntu-24.04
    # Keep every historical control and capacity playout; controls alone may need twenty minutes.
    # The complete capacity/control gate took 44m50s on the reviewed candidate.
    # Keep every assertion and playout; allow bounded runner-speed headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      # verify includes Frontend exclusion, Designer checks, historical Balance and the 1.3 capacity gate.
      # Missing suites/engines, incomplete reports and mismatched candidate/build pins fail.
      - name: Documentation and reference integrity
        if: needs.changes.outputs.scope == 'docs'
        run: npm run check:toolchain && npm run check:workspace && npm run check:sources
      - name: Client behavior, compatibility and presentation
        if: needs.changes.outputs.scope == 'frontend'
        run: >-
          npm run check:toolchain && npm run check:workspace && npm run check:sources && npm run typecheck &&
          npm run test:bootstrap && npm run test:tooling && npm run test:frontend && npm run test:design
      - name: Complete release verification
        if: needs.changes.outputs.scope == 'full'
        run: npm run verify
      - if: needs.changes.outputs.scope != 'docs'
        run: npm run check:browser-dependencies
      - if: needs.changes.outputs.scope == 'full'
        run: npm run package:backend -- --verify-install
      - if: needs.changes.outputs.scope == 'full'
        run: npm run package:backend -- --planet --verify-install

  backend-emulator:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    # Keep all data tests plus real timed Functions acceptance on one fresh pair of suites.
    # The 563 data cases reached 33 minutes on a hosted runner before timed
    # Functions and native journeys. Retain every step within a bounded hour.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - run: node node_modules/vite/bin/vite.js build --config apps/game/dev/planet-emulator/vite.config.mjs
      # Native user controls use actual Auth/Firestore/Functions and private automatic workers.
      # Keep this suite fresh: it must not share injected-clock data fixtures.
      - run: >-
          node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config infra/firebase/firebase.json --project demo-mothership --only auth,firestore,functions
          "node apps/game/dev/planet-emulator/capture.mjs /tmp/gamen-planet-native-ui"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5101
          MOTHERSHIP_PLANET_CREATION_ENABLED: 'true'
          MOTHERSHIP_PLANET_ASSET_MANIFEST_VERSION: design-0.6.0

      # A fresh emulator session verifies the new profile's actual Tasks deadlines.
      # The historical-profile journey above does not establish pre-vote Blackout.
      - name: Verify pre-vote Blackout with real Functions and Tasks
        run: >-
          node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config infra/firebase/firebase.json --project demo-mothership --only auth,firestore,functions
          "node --test infra/firebase/test-emulator/planet-blackout/connected.test.mjs"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5101
          MOTHERSHIP_PLANET_CREATION_ENABLED: 'true'
          MOTHERSHIP_PLANET_ASSET_MANIFEST_VERSION: design-0.8.0
          MOTHERSHIP_PLANET_SETUP_FLOW_VERSION: '3'
          MOTHERSHIP_PLANET_ENGINE_PROFILE: blackout-before-vote-1.3

  # Keep the cold Food acceptance independent of the 603-case emulator group.
  # A failure needs a short, reproducible rerun without repeating unrelated journeys.
  backend-food-cold-emulator:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build
      # Real JOIN, private Firestore trigger and Tasks handler. No injected clock,
      # warm-up request, retry, skipped assertion or relaxed gameplay deadline.
      - name: Verify Food inbox cold start with real Functions and Tasks
        run: >-
          node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config infra/firebase/firebase.json --project demo-mothership --only auth,firestore,functions
          "node --test services/game-api/test-emulator/planet-food/inbox-cold.test.mjs"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5101
          MOTHERSHIP_PLANET_CREATION_ENABLED: 'true'
          MOTHERSHIP_PLANET_ASSET_MANIFEST_VERSION: design-0.9.0
          MOTHERSHIP_PLANET_SETUP_FLOW_VERSION: '3'
          MOTHERSHIP_PLANET_ENGINE_PROFILE: food-task-1.4
          MOTHERSHIP_PLANET_FOOD_AUTHORITY_PROFILE: food-owner-inbox-1
          # Bounded local emulator diagnostics only; no cloud configuration change.
          MOTHERSHIP_PLANET_REQUEST_TIMING: 'true'

  backend-declared-hack-emulator:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    # Exercise the actual release selector and automatic 15/5/60-second flow.
    # A separate runner prevents historical fixtures from sharing task state.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build && node scripts/test-emulator.mjs functions
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_NEW_MATCH_PROFILE: declared-hack-1.5
          MOTHERSHIP_ASSET_MANIFEST_VERSION: design-0.3.0
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  backend-board-v2-emulator:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    # Preserve 1.10 and verify the new 1.11 creation/Ready pair and automatic public capsule.
    # A separate runner prevents historical fixtures from sharing task state.
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: board-v2-1.10
            art: design-0.4.0
          - profile: hospital-four-1.11
            art: design-0.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build && node scripts/test-emulator.mjs functions
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_NEW_MATCH_PROFILE: ${{ matrix.profile }}
          MOTHERSHIP_ASSET_MANIFEST_VERSION: ${{ matrix.art }}
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  frontend-emulator:
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:frontend:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'

  frontend-board-v2-emulator:
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: board-v2-1.10
            art: design-0.4.0
          - profile: hospital-four-1.11
            art: design-0.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: >-
          npm run build && node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config infra/firebase/firebase.json --project demo-mothership --only auth,firestore,functions
          "node --test --test-concurrency=1 apps/game/test-emulator/*.test.mjs"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5101
          MOTHERSHIP_NEW_MATCH_PROFILE: ${{ matrix.profile }}
          MOTHERSHIP_ASSET_MANIFEST_VERSION: ${{ matrix.art }}
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  # Keep the required name. Only suites explicitly excluded by a successful plan may skip.
  bootstrap:
    needs: [changes, verify, backend-emulator, backend-food-cold-emulator, backend-declared-hack-emulator, backend-board-v2-emulator, frontend-emulator, frontend-board-v2-emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Require exactly the planned verification suites
        env:
          CHECK_SCOPE: ${{ needs.changes.outputs.scope }}
          CHECK_PLAN_RESULT: ${{ needs.changes.result }}
          CHECK_RESULTS: >-
            {"verify":"${{ needs.verify.result }}",
            "backend-emulator":"${{ needs['backend-emulator'].result }}",
            "backend-food-cold-emulator":"${{ needs['backend-food-cold-emulator'].result }}",
            "backend-declared-hack-emulator":"${{ needs['backend-declared-hack-emulator'].result }}",
            "backend-board-v2-emulator":"${{ needs['backend-board-v2-emulator'].result }}",
            "frontend-emulator":"${{ needs['frontend-emulator'].result }}",
            "frontend-board-v2-emulator":"${{ needs['frontend-board-v2-emulator'].result }}"}
        run: node scripts/ci-check-plan.mjs --assert
