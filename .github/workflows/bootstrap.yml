name: Workspace, frontend and backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Keep every historical control and capacity playout; controls alone may need twenty minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      # verify includes Frontend exclusion, Designer checks, historical Balance and the 1.3 capacity gate.
      # Missing suites/engines, incomplete reports and mismatched candidate/build pins fail.
      - run: npm run verify
      - run: npm run check:browser-dependencies
      - run: npm run package:backend -- --verify-install

  backend-emulator:
    # Keep all data tests plus real timed Functions acceptance on one fresh pair of suites.
    # The 505 data cases alone take about 20 minutes on the hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'

  backend-declared-hack-emulator:
    # Exercise the actual release selector and automatic 15/5/60-second flow.
    # A separate runner prevents historical fixtures from sharing task state.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build && node scripts/test-emulator.mjs functions
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_NEW_MATCH_PROFILE: declared-hack-1.5
          MOTHERSHIP_ASSET_MANIFEST_VERSION: design-0.3.0
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  backend-board-v2-emulator:
    # Exercise the final 1.10 creation selector, exact 0.4 Ready and automatic public capsule.
    # A separate runner prevents historical fixtures from sharing task state.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build && node scripts/test-emulator.mjs functions
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_NEW_MATCH_PROFILE: board-v2-1.10
          MOTHERSHIP_ASSET_MANIFEST_VERSION: design-0.4.0
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  frontend-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:frontend:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'

  frontend-board-v2-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: >-
          npm run build && node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec
          --config infra/firebase/firebase.json --project demo-mothership --only auth,firestore,functions
          "node --test --test-concurrency=1 apps/game/test-emulator/*.test.mjs"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
          MOTHERSHIP_FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5101
          MOTHERSHIP_NEW_MATCH_PROFILE: board-v2-1.10
          MOTHERSHIP_ASSET_MANIFEST_VERSION: design-0.4.0
          MOTHERSHIP_LEGACY_ASSET_MANIFEST_VERSION: v1-preview-469bf64fe98cac5a

  # Preserve the existing required check name and fail if any suite fails, cancels or skips.
  bootstrap:
    needs: [verify, backend-emulator, backend-declared-hack-emulator, backend-board-v2-emulator, frontend-emulator, frontend-board-v2-emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all verification suites
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BACKEND_RESULT: ${{ needs['backend-emulator'].result }}
          DECLARED_HACK_RESULT: ${{ needs['backend-declared-hack-emulator'].result }}
          BOARD_V2_RESULT: ${{ needs['backend-board-v2-emulator'].result }}
          FRONTEND_BOARD_V2_RESULT: ${{ needs['frontend-board-v2-emulator'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-emulator'].result }}
        run: |
          set -eu
          test "$VERIFY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$DECLARED_HACK_RESULT" = success
          test "$BOARD_V2_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$FRONTEND_BOARD_V2_RESULT" = success
