name: Workspace, frontend and backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      # verify preserves Frontend suites/exclusion and adds reviewed Balance static + real-engine gates.
      # Missing suites/engines, incomplete reports and mismatched candidate/build pins fail.
      - run: npm run verify
      - run: npm run check:browser-dependencies
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - run: npm run test:frontend:emulator
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
      - run: npm run package:backend -- --verify-install
