<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297" role="img" aria-labelledby="title desc">
  <title id="title">Mothership — Location Board Prototype</title>
  <desc id="desc">A3 board with Room A, Room B, Command Room, Hospital, Jail, a conditional Final Zone, and a five-round tracker.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M 8 0 L 0 0 0 8" fill="none" stroke="#dfe7ec" stroke-width=".25"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#497f85"/></marker>
    <marker id="proposalArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ac8c50"/></marker>
    <style>
      .fa{font-family:Tahoma,Arial,sans-serif;direction:ltr;fill:#25384a}
      .en{font-family:Arial,sans-serif;letter-spacing:1.1px;fill:#25384a}
      .zone{fill:#fff;stroke:#80949f;stroke-width:.8}
      .slot{fill:none;stroke:#cbd9df;stroke-width:.55;stroke-dasharray:1.6 2.2}
      .small{font-size:3.5px}.tiny{font-size:2.8px}
    </style>
  </defs>
  <rect width="420" height="297" fill="#f2f5f6"/>
  <rect x="8" y="8" width="404" height="281" rx="5" fill="url(#grid)" stroke="#9eafb8" stroke-width=".7"/>
  <path d="M 14 40 H 406 M 14 281 H 406" stroke="#b6c5cc" stroke-width=".6"/>

  <text x="19" y="25" class="fa" font-size="8" font-weight="bold" text-anchor="start">MOTHERSHIP</text>
  <text x="19" y="34" class="fa small" text-anchor="start">LOCATION BOARD PROTOTYPE · A3 · TEST LAYOUT</text>
  <text x="390" y="17" class="fa small" text-anchor="middle" font-weight="bold">ROUND</text>
  <g font-family="Arial,sans-serif" font-size="5" text-anchor="middle" dominant-baseline="middle" fill="#25384a">
    <circle cx="302" cy="28" r="6.5" fill="#fff" stroke="#6f8e9d"/><text x="302" y="28">1</text>
    <circle cx="324" cy="28" r="6.5" fill="#fff" stroke="#6f8e9d"/><text x="324" y="28">2</text>
    <circle cx="346" cy="28" r="6.5" fill="#fff" stroke="#6f8e9d"/><text x="346" y="28">3</text>
    <circle cx="368" cy="28" r="6.5" fill="#fff" stroke="#6f8e9d"/><text x="368" y="28">4</text>
    <circle cx="390" cy="28" r="6.5" fill="#fff" stroke="#6f8e9d"/><text x="390" y="28">5</text>
  </g>

  <!-- The two dotted Captain routes are layout proposals, not finalized adjacency rules. -->
  <path d="M 136 113 Q 145 98 172 93 M 284 113 Q 275 98 248 93" fill="none" stroke="#ac8c50" stroke-width="1.3" stroke-dasharray="3 2.5" marker-end="url(#proposalArrow)"/>
  <rect x="154" y="45" width="112" height="49" rx="5" fill="#fffaf0" stroke="#ac8c50" stroke-width="1.2"/>
  <path d="M 159 53 H 261" stroke="#ddc992" stroke-width=".6"/>
  <text x="210" y="58" class="en" text-anchor="middle" font-size="6.2" font-weight="bold">COMMAND ROOM</text>
  <text x="210" y="66" class="fa small" text-anchor="middle">CAPTAIN ONLY</text>
  <text x="210" y="72" class="fa tiny" text-anchor="middle">Protected from actions and shots while inside</text>
  <circle cx="210" cy="83" r="6" fill="#fff" stroke="#ac8c50" stroke-width=".8"/>
  <text x="210" y="84.3" class="en" text-anchor="middle" font-size="3.5">C</text>
  <text x="210" y="102" class="fa tiny" text-anchor="middle">Dotted A/B → Command routes are proposals</text>

  <!-- Public token spaces have no fixed capacity or faction colors. -->
  <rect x="18" y="113" width="132" height="96" rx="5" class="zone"/>
  <path d="M 18 118 Q 18 113 23 113 H 145 Q 150 113 150 118 V 133 H 18 Z" fill="#e3f1ee"/>
  <text x="30" y="127" class="en" font-size="6.3" font-weight="bold">ROOM A</text>
  <text x="140" y="126" class="fa tiny" text-anchor="end">ACTIVE</text>
  <rect x="27" y="141" width="114" height="58" rx="3" class="slot"/>
  <text x="84" y="172" class="fa small" text-anchor="middle" fill="#7e939f">NUMBERED PLAYER TOKENS</text>

  <rect x="270" y="113" width="132" height="96" rx="5" class="zone"/>
  <path d="M 270 118 Q 270 113 275 113 H 397 Q 402 113 402 118 V 133 H 270 Z" fill="#e3f1ee"/>
  <text x="282" y="127" class="en" font-size="6.3" font-weight="bold">ROOM B</text>
  <text x="392" y="126" class="fa tiny" text-anchor="end">ACTIVE</text>
  <rect x="279" y="141" width="114" height="58" rx="3" class="slot"/>
  <text x="336" y="172" class="fa small" text-anchor="middle" fill="#7e939f">NUMBERED PLAYER TOKENS</text>

  <path d="M 154 158 H 266" stroke="#497f85" stroke-width="1.7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="160" y="135" width="100" height="17" rx="2.6" fill="#f2f5f6" stroke="#b3c8c8" stroke-width=".5"/>
  <text x="210" y="143" class="fa small" text-anchor="middle" font-weight="bold">A ⇄ B: ONE MOVE PER ROUND</text>
  <text x="210" y="149" class="fa tiny" text-anchor="middle">Any time before voting begins</text>
  <text x="210" y="180" class="fa tiny" text-anchor="middle">Solid line = confirmed movement</text>
  <text x="210" y="187" class="fa tiny" text-anchor="middle">No voluntary exit from Hospital or Jail</text>

  <rect x="18" y="221" width="132" height="52" rx="5" fill="#f8f6ff" stroke="#837caf" stroke-width="1"/>
  <text x="29" y="233" class="en" font-size="5.6" font-weight="bold">HOSPITAL</text>
  <text x="140" y="233" class="fa tiny" text-anchor="end">BY INJURY</text>
  <path d="M 27 239 H 141" stroke="#dedaf0" stroke-width=".6"/>
  <text x="84" y="253" class="fa small" text-anchor="middle">INJURED PLAYER TOKENS</text>
  <text x="84" y="263" class="fa tiny" text-anchor="middle">No voluntary movement from here</text>

  <rect x="154" y="221" width="112" height="52" rx="5" fill="#fff9ed" stroke="#c29754" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="210" y="233" class="en" text-anchor="middle" font-size="5.4" font-weight="bold">FINAL ZONE</text>
  <text x="210" y="242" class="fa tiny" text-anchor="middle">Only if Round 5 has no winner</text>
  <text x="210" y="249" class="fa tiny" text-anchor="middle">All non-Eliminated players transfer</text>
  <text x="210" y="256" class="fa tiny" text-anchor="middle">Special shots → recheck victory</text>
  <text x="210" y="264" class="fa tiny" text-anchor="middle">If no winner: draw</text>

  <rect x="270" y="221" width="132" height="52" rx="5" fill="#fff6f4" stroke="#b27672" stroke-width="1"/>
  <text x="281" y="233" class="en" font-size="5.6" font-weight="bold">JAIL</text>
  <text x="392" y="233" class="fa tiny" text-anchor="end">BY VOTE</text>
  <path d="M 279 239 H 393" stroke="#efd9d7" stroke-width=".6"/>
  <text x="336" y="253" class="fa small" text-anchor="middle">JAILED PLAYER TOKENS</text>
  <text x="336" y="263" class="fa tiny" text-anchor="middle">No voluntary movement from here</text>

  <text x="19" y="286" class="fa tiny" text-anchor="start">Only public location and status appear here; roles, factions, weapons and Protection stay hidden.</text>
  <text x="401" y="286" class="fa tiny" text-anchor="end">Return after healing / release: open decision</text>
</svg>
