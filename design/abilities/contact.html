<!doctype html>
<!-- mothership:dev-only · Contact sheet of the ability-art review pictures (design/abilities/review/). Synthetic; desktop Chromium renders with simulated viewports, not device measurements. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mothership · ability art · contact sheet</title>
  <link rel="stylesheet" href="../prototypes/css/tokens.css">
  <style>
    body { margin: 0; background: var(--ms-color-canvas); color: var(--ms-color-text); font-family: var(--ms-font-body); }
    main { padding: 24px 28px 36px; display: grid; gap: 22px; }
    h1 { margin: 0; font-family: var(--ms-font-lettering); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; font-size: 26px; }
    .meta { margin: 0; color: var(--ms-color-text-secondary); font-size: 13px; line-height: 1.45; max-width: 140ch; }
    .flag { display: inline-block; padding: 0 6px; border: 2px dashed currentColor; border-radius: 3px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; vertical-align: 2px; }
    section { display: grid; gap: 10px; }
    h2 { margin: 0; font-family: var(--ms-font-lettering); font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid var(--ms-color-steel-mid); padding-bottom: 4px; }
    .grid { display: flex; flex-wrap: wrap; gap: 14px 12px; align-items: flex-start; }
    figure { margin: 0; display: grid; gap: 4px; width: var(--w, 200px); }
    img { display: block; width: 100%; height: auto; border: 2px solid var(--ms-color-steel-mid); border-radius: 4px; background: var(--ms-color-ink); }
    figcaption { font-size: 11px; line-height: 1.3; color: var(--ms-color-text-secondary); }
    figcaption b { display: block; color: var(--ms-color-text); font-size: 12px; }
  </style>
</head>
<body>
  <main id="sheet"></main>
  <script type="module">
    window.__designReady = false;
    const report = await fetch('./review/report.json').then(response => response.json());
    const slice = Number(new URLSearchParams(location.search).get('slice') ?? 1);
    const SLICES = {
      1: ['The Insider’s file', 'The three players and the three roles as a set: who holds which is not known, and nothing draws a mapping.'],
      2: ['The Hacker’s file and the Alien’s, the Code and the Scan', 'The Hacker’s known Undercover and every Scan result as authorized; the Alien’s Code, four players in no order; a Code attempt’s picks as a set, in seat order.'],
    };
    const sheet = document.getElementById('sheet');
    const el = (tag, attrs = {}, ...kids) => { const node = document.createElement(tag); for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value); node.append(...kids.filter(kid => kid !== null)); return node; };
    sheet.append(el('h1', {}, SLICES[slice][0], el('span', { class: 'flag' }, 'Synthetic · private · a proposal')),
      el('p', { class: 'meta' }, `Ability art, slice ${slice}, on the board-motion phone prototype. ${SLICES[slice][1]} ${report.browser}, simulated phone viewports at ${report.scale}x: not device measurements. Every name is synthetic; nothing here is a match.`));
    const mine = report.shots.filter(shot => (shot.slice ?? 1) === slice);
    const groups = [...new Set(mine.map(shot => shot.group))];
    for (const group of groups) {
      const shots = mine.filter(shot => shot.group === group);
      const framed = /assembly/i.test(group);
      const width = framed ? 170 : shots.some(shot => shot.phone === 'w320') ? 214 : 250;
      sheet.append(el('section', {}, el('h2', {}, group), el('div', { class: 'grid' },
        ...shots.map(shot => el('figure', { style: `--w:${shot.phone === 'w320' && !framed ? Math.round(width * 320 / 390) : width}px` },
          el('img', { src: `./review/${shot.file.split('/').pop()}`, alt: shot.title }),
          el('figcaption', {}, el('b', {}, shot.title), shot.problems.length ? `${shot.problems.length} problems` : 'measured clean'))))));
    }
    await Promise.all([...document.images].map(image => image.decode().catch(() => null)));
    window.__designReady = true;
  </script>
</body>
</html>
