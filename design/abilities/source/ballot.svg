<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · ability art proposal · ballot kit
  Original vector artwork made for this repository. Rights and provenance: design/abilities/assets/manifest.json.

  PRIVATE. The pieces of a seat's own ballot, the Captain's release request, a Hack and Pass, added to the
  earlier kits: a ballot slip and its top edge, a pencil tick and a pencil cross, a ballot box, a key ring
  round a jailed player's chip, a comms ring round a Hack's target, a coiled cord between the two partners
  of a Hack, and the speaking turn's microphone, held and handed on. Drawn only inside that seat's own
  open card or its own action strip, never on the board, the shared display or in a public cue: a count
  is public only as the board's tally. Every player phone loads the whole kit in one stylesheet, whatever
  its role, and nothing in it is named after or coloured for a role or a team: every seat votes, asks for
  a Hack and passes with the same pieces.

  No text is drawn: every word, number and stamp is live text in the client. Colors are token values
  (tokens 0.4.0): paper, the paper shades, ink, canvas, the steel values and the caption yellow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <!-- A ballot slip: perforated paper with a box for the chip of the player it names, the window round (24, 25), r 15. 48 x 56. -->
  <g transform="translate(10 6)">
    <g id="dossier-ballot">
      <path d="M4 3 H44 V54 H4 Z" fill="#151923" opacity="0.3" transform="translate(2 2)"/>
      <path d="M4 3 H44 V54 H4 Z" fill="#F4EBDD" stroke="#151923" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="9" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="14" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="19" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="24" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="29" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="34" cy="6" r="0.9" fill="#CBBBA2"/>
      <circle cx="39" cy="6" r="0.9" fill="#CBBBA2"/>
      <rect x="8" y="9" width="32" height="32" rx="3" fill="#E3D6C2" stroke="#55657E" stroke-width="1.6"/>
      <path d="M10 46 H38 M10 50 H30" fill="none" stroke="#B9C4D3" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A ballot slip's top edge, as it shows in the slot of the box once it is posted. 18 x 12. -->
  <g transform="translate(70 10)">
    <g id="dossier-ballot-edge">
      <path d="M2 11 V3 Q2 1.5 3.5 1.5 H14.5 Q16 1.5 16 3 V11 Z" fill="#F4EBDD" stroke="#151923" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="5.5" cy="4.5" r="0.7" fill="#CBBBA2"/>
      <circle cx="9" cy="4.5" r="0.7" fill="#CBBBA2"/>
      <circle cx="12.5" cy="4.5" r="0.7" fill="#CBBBA2"/>
      <path d="M5 8 H13" fill="none" stroke="#B9C4D3" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A pencil tick: a vote for the player on the slip, or Yes to a release. Haloed in paper, so that it reads on a chip. 24 x 24. -->
  <g transform="translate(100 10)">
    <g id="dossier-tick">
      <path d="M4 13 L10 19 L20 5" fill="none" stroke="#F4EBDD" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 13 L10 19 L20 5" fill="none" stroke="#151923" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- A pencil cross: No to a release. 24 x 24. -->
  <g transform="translate(130 10)">
    <g id="dossier-x-mark">
      <path d="M5 5 L19 19 M19 5 L5 19" fill="none" stroke="#F4EBDD" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M5 5 L19 19 M19 5 L5 19" fill="none" stroke="#151923" stroke-width="3.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A ballot box: a body with a paper label, a lid with its slot, the slot's middle at (17, 9). 36 x 34. -->
  <g transform="translate(160 10)">
    <g id="dossier-ballot-box">
      <rect x="4" y="12" width="30" height="21" rx="1.5" fill="#151923" opacity="0.3"/>
      <rect x="2" y="10" width="30" height="21" rx="1.5" fill="#8696AE" stroke="#151923" stroke-width="2"/>
      <rect x="8" y="16" width="18" height="10" rx="1" fill="#F4EBDD" stroke="#151923" stroke-width="1.4"/>
      <path d="M11 20 H23 M11 23 H19" fill="none" stroke="#B9C4D3" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="0.8" y="6" width="32.4" height="6" rx="1.5" fill="#55657E" stroke="#151923" stroke-width="2"/>
      <rect x="9" y="7.9" width="16" height="2.2" rx="1" fill="#151923"/>
    </g>
  </g>

  <!-- A key ring round the chip of a jailed player the Captain asks to release: the ring round (24, 26), r 20, the key hung on it. 48 x 48. -->
  <g transform="translate(210 10)">
    <g id="dossier-key-ring">
      <circle cx="24" cy="26" r="20" fill="none" stroke="#151923" stroke-width="3.2"/>
      <circle cx="24" cy="26" r="20" fill="none" stroke="#F4EBDD" stroke-width="1.4"/>
      <path d="M37.5 39.5 L44.5 46.5" fill="none" stroke="#151923" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M37.5 39.5 L44.5 46.5" fill="none" stroke="#F7C52B" stroke-width="2" stroke-linecap="round"/>
      <path d="M41 44.6 L39.2 46.4 M43.2 46.8 L41.6 48" fill="none" stroke="#151923" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36.5" cy="38.5" r="5" fill="#F7C52B" stroke="#151923" stroke-width="2"/>
      <circle cx="36.5" cy="38.5" r="1.6" fill="#151923"/>
    </g>
  </g>

  <!-- A comms ring round the chip of a Hack's target: the ring round (28, 28), r 19, clear within r 17, a signal arc each side. 56 x 56. -->
  <g transform="translate(270 10)">
    <g id="dossier-comms">
      <circle cx="28" cy="28" r="19" fill="none" stroke="#151923" stroke-width="3.4"/>
      <circle cx="28" cy="28" r="19" fill="none" stroke="#F4EBDD" stroke-width="1.4"/>
      <path d="M6 19 Q2 28 6 37 M50 19 Q54 28 50 37" fill="none" stroke="#151923" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M6 19 Q2 28 6 37 M50 19 Q54 28 50 37" fill="none" stroke="#F7C52B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A coiled cord between the two chips of a Hack's partners, from (2, 12) to (62, 12). 64 x 24. -->
  <g transform="translate(340 10)">
    <g id="dossier-cord">
      <path d="M2 12 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0" fill="none" stroke="#151923" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 12 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0 c4 -9 10 -9 10 0 c0 9 -6 9 -4 0" fill="none" stroke="#B9C4D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- The speaking turn's microphone, held. 22 x 36. -->
  <g transform="translate(420 10)">
    <g id="dossier-mic">
      <rect x="6" y="4" width="14" height="16" rx="7" fill="#151923" opacity="0.3"/>
      <rect x="4" y="2" width="14" height="16" rx="7" fill="#B9C4D3" stroke="#151923" stroke-width="2"/>
      <path d="M7.5 7 H14.5 M7 10.5 H15 M7.5 14 H14.5" fill="none" stroke="#55657E" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M7 5 Q8.5 3.4 10.5 3.2" fill="none" stroke="#F4EBDD" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="3.5" y="15.5" width="15" height="3.4" rx="1.2" fill="#F7C52B" stroke="#151923" stroke-width="1.4"/>
      <path d="M11 19 V29" fill="none" stroke="#151923" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M11 19 V29" fill="none" stroke="#8696AE" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M4.5 34 Q11 27 17.5 34 Z" fill="#55657E" stroke="#151923" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- The microphone handed on: its outline, dashed. 22 x 36. -->
  <g transform="translate(460 10)">
    <g id="dossier-mic-passed">
      <rect x="4" y="2" width="14" height="16" rx="7" fill="#E3D6C2" stroke="#151923" stroke-width="1.8" stroke-dasharray="3 2"/>
      <path d="M11 19 V29" fill="none" stroke="#151923" stroke-width="1.6" stroke-dasharray="3 2" stroke-linecap="round"/>
      <path d="M4.5 34 Q11 27 17.5 34 Z" fill="#E3D6C2" stroke="#151923" stroke-width="1.4" stroke-dasharray="3 2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
