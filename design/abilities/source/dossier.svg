<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · ability art proposal · dossier kit
  Original vector artwork made for this repository. Rights and provenance: design/abilities/assets/manifest.json.

  PRIVATE. The paper, pins and folders of a seat's own file: the Insider's investigation board
  first, and later the Hacker's, the Alien's and every private result. Drawn only inside that
  seat's own open private sheet, never on the board, the shared display or in a public cue.
  Every player phone loads the whole kit in one stylesheet, whatever its role, and every piece
  of it is the same for every role: nothing in it is named after or coloured for a role or a team.

  Neutral by construction: one pin, one photo frame, one query tag, one stamp, each drawn once
  and used for every candidate alike, so no candidate can be told apart by the art. The
  portraits are the approved crew cards (design/source/crew/), the player's public choice.
  No text is drawn: names, seat numbers, role names and stamps are live text in the client.

  A sheet: the wrapper groups lay the layers out for editing; each layer is exported in its own
  box (design/abilities/recipes.json). Colors are token values (tokens 0.4.0): paper, the paper
  shades, ink, canvas, the steel values and the caption yellow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <defs>
    <pattern id="dossier-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#151923"/>
      <circle cx="4.5" cy="4.5" r="0.9" fill="#151923"/>
    </pattern>
    <pattern id="dossier-ink-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.8" fill="#151923"/>
    </pattern>
  </defs>

  <!-- The cork of the board, a tile: kraft paper, a halftone grain, light and dark flecks. 96 x 96, seamless. -->
  <g transform="translate(10 10)">
    <g id="dossier-cork">
      <rect x="0" y="0" width="96" height="96" fill="#CBBBA2"/>
      <rect x="0" y="0" width="96" height="96" fill="url(#dossier-dots)" opacity="0.14"/>
      <g fill="#E3D6C2" opacity="0.8">
        <ellipse cx="14" cy="17" rx="3" ry="1.5" transform="rotate(22 14 17)"/>
        <ellipse cx="41" cy="9" rx="2.2" ry="1.2" transform="rotate(-30 41 9)"/>
        <ellipse cx="70" cy="22" rx="3.4" ry="1.6" transform="rotate(8 70 22)"/>
        <ellipse cx="28" cy="46" rx="2.6" ry="1.3" transform="rotate(-12 28 46)"/>
        <ellipse cx="58" cy="54" rx="2" ry="1.1" transform="rotate(40 58 54)"/>
        <ellipse cx="84" cy="66" rx="3" ry="1.4" transform="rotate(-25 84 66)"/>
        <ellipse cx="17" cy="78" rx="2.4" ry="1.2" transform="rotate(15 17 78)"/>
        <ellipse cx="47" cy="85" rx="3.2" ry="1.5" transform="rotate(-5 47 85)"/>
      </g>
      <g fill="#151923" opacity="0.22">
        <ellipse cx="31" cy="25" rx="1.6" ry="0.9" transform="rotate(30 31 25)"/>
        <ellipse cx="80" cy="39" rx="1.4" ry="0.8" transform="rotate(-20 80 39)"/>
        <ellipse cx="9" cy="57" rx="1.5" ry="0.9" transform="rotate(10 9 57)"/>
        <ellipse cx="66" cy="76" rx="1.7" ry="0.9" transform="rotate(-35 66 76)"/>
        <ellipse cx="38" cy="66" rx="1.2" ry="0.7" transform="rotate(25 38 66)"/>
        <ellipse cx="88" cy="88" rx="1.4" ry="0.8" transform="rotate(5 88 88)"/>
      </g>
    </g>
  </g>

  <!-- A strip of tape for the board's corners. 64 x 22. -->
  <g transform="translate(120 20)">
    <g id="dossier-tape">
      <path d="M3 4 L7 2 L10 4.5 L60 2.5 L58 6.5 L61.5 11 L58 15 L60 19.5 L9 20 L5 18 L2 20 L4 14 L1.5 10 L4 6.5 Z" fill="#E3D6C2" stroke="#151923" stroke-width="1.6" stroke-linejoin="round" opacity="0.94"/>
      <path d="M12 7.5 H52 M14 14.5 H47" fill="none" stroke="#CBBBA2" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A push pin, seen from above, with its shadow on the cork. 26 x 28. The point is at (12, 10). -->
  <g transform="translate(200 16)">
    <g id="dossier-pin">
      <ellipse cx="16" cy="20" rx="7.5" ry="3.4" fill="#151923" opacity="0.3"/>
      <path d="M12 12 L15.5 22" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="12" cy="10" r="8.6" fill="#8696AE" stroke="#151923" stroke-width="2.6"/>
      <circle cx="12" cy="10" r="4.6" fill="#B9C4D3" stroke="#151923" stroke-width="1.4"/>
      <ellipse cx="9.2" cy="7.2" rx="2.3" ry="1.5" fill="#F4EBDD" opacity="0.85" transform="rotate(-32 9.2 7.2)"/>
    </g>
  </g>

  <!-- A snapshot frame: a portrait (the crew card, 84 x 96) goes in the window at (10, 10). 104 x 134. -->
  <g transform="translate(250 10)">
    <g id="dossier-photo">
      <rect x="7" y="8" width="96" height="124" rx="2.5" fill="#151923" opacity="0.32"/>
      <rect x="2" y="2" width="96" height="124" rx="2.5" fill="#F4EBDD" stroke="#151923" stroke-width="3"/>
      <rect x="10" y="10" width="80" height="92" fill="#10141C" stroke="#151923" stroke-width="2"/>
      <path d="M86 4 H96 V124 H76 Q95 82 86 4 Z" fill="url(#dossier-ink-dots)" opacity="0.28"/>
      <path d="M7 108 H93" fill="none" stroke="#E3D6C2" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A query tag on a loop of string: the same mark on every candidate. 30 x 38. -->
  <g transform="translate(370 14)">
    <g id="dossier-query">
      <path d="M15 9 Q12 2 16.5 1.5 Q21 1 19.5 7" fill="none" stroke="#151923" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5.5 10.5 L15 5 L24.5 10.5 V34 Q24.5 36.5 22 36.5 H8 Q5.5 36.5 5.5 34 Z" fill="#F4EBDD" stroke="#151923" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="15" cy="10.5" r="1.9" fill="#10141C"/>
      <path d="M10.6 19.5 Q10.6 14.6 15.2 14.6 Q19.8 14.6 19.8 19 Q19.8 22 16.4 23.5 Q15.2 24.1 15.2 27" fill="none" stroke="#151923" stroke-width="2.7" stroke-linecap="round"/>
      <circle cx="15.2" cy="31.2" r="1.8" fill="#151923"/>
    </g>
  </g>

  <!-- A magnifying lens: inspect. 30 x 30. -->
  <g transform="translate(420 14)">
    <g id="dossier-lens">
      <path d="M19 19 L27 27" fill="none" stroke="#151923" stroke-width="6" stroke-linecap="round"/>
      <path d="M19 19 L27 27" fill="none" stroke="#55657E" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="9" fill="#B9C4D3" stroke="#151923" stroke-width="2.8"/>
      <path d="M7.4 11 Q8.2 7 12 6.6" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- A paper clip. 18 x 46. -->
  <g transform="translate(470 10)">
    <g id="dossier-clip">
      <path d="M5 42 V10 Q5 3.5 10 3.5 Q15 3.5 15 10 V37 Q15 42.5 10.5 42.5 Q6.5 42.5 6.5 37.5 V15" fill="none" stroke="#151923" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 42 V10 Q5 3.5 10 3.5 Q15 3.5 15 10 V37 Q15 42.5 10.5 42.5 Q6.5 42.5 6.5 37.5 V15" fill="none" stroke="#B9C4D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- A rubber-stamp frame for a live word: two worn borders in the stamp's slate. 132 x 40. -->
  <g transform="translate(10 130)">
    <g id="dossier-stamp">
      <rect x="3" y="3" width="126" height="34" rx="4" fill="none" stroke="#34415A" stroke-width="3.2" stroke-dasharray="22 2 9 1.5 31 2.5 14 1 40 2"/>
      <rect x="8.5" y="8.5" width="115" height="23" rx="2.5" fill="none" stroke="#34415A" stroke-width="1.4" stroke-dasharray="17 1.5 26 2 11 1 50 2"/>
    </g>
  </g>

  <!-- An envelope, open, in two layers so that what it holds sits between them. 224 x 88. -->
  <g transform="translate(160 130)">
    <g id="dossier-envelope-back">
      <path d="M6 34 L112 6 L218 34 V84 H6 Z" fill="#CBBBA2" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M34 34 L112 14 L190 34" fill="none" stroke="#151923" stroke-width="1.4" opacity="0.45"/>
    </g>
  </g>
  <g transform="translate(160 230)">
    <g id="dossier-envelope-front">
      <path d="M6 44 H218 V80 Q218 85 213 85 H11 Q6 85 6 80 Z" fill="#E3D6C2" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M8 83 L84 50 M216 83 L140 50" fill="none" stroke="#151923" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
      <path d="M170 46 H216 V80 Q216 83 213 83 H150 Q178 66 170 46 Z" fill="url(#dossier-ink-dots)" opacity="0.25"/>
    </g>
  </g>

  <!-- A closed folder: the cover of any private file while it is hidden. The same for every role. 224 x 152. -->
  <g transform="translate(10 190)">
    <g id="dossier-folder">
      <path d="M10 31 Q6 31 6 35 V144 Q6 149 11 149 H213 Q218 149 218 144 V35 Q218 31 214 31 Z" fill="#151923" opacity="0.32" transform="translate(4 5)"/>
      <path d="M6 30 Q6 26 10 26 H86 L98 12 H150 L160 26 H214 Q218 26 218 30 V144 Q218 148 214 148 H10 Q6 148 6 144 Z" fill="#CBBBA2" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M6 46 Q6 42 10 42 H214 Q218 42 218 46 V144 Q218 148 214 148 H10 Q6 148 6 144 Z" fill="#E3D6C2" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M176 44 H216 V144 Q216 146 214 146 H150 Q182 100 176 44 Z" fill="url(#dossier-ink-dots)" opacity="0.25"/>
      <rect x="62" y="76" width="100" height="36" rx="3" fill="#F4EBDD" stroke="#151923" stroke-width="2.4"/>
      <path d="M112 42 V56" fill="none" stroke="#151923" stroke-width="2.4"/>
      <circle cx="112" cy="60" r="6.5" fill="#8696AE" stroke="#151923" stroke-width="2.4"/>
      <path d="M118 60 Q140 62 138 72 Q136 80 124 76" fill="none" stroke="#151923" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
