<!doctype html>
<!-- mothership:dev-only. The character pilot's review page: ?view=sheet or ?view=motion (design/character-pilot/review.mjs). A design review page, not the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character pilot</title>
<style>
  :root { --ink: #151923; --paper: #F4EBDD; --shade: #E3D6C2; --night: #12141B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 22px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0; max-width: 980px; }
  .v { opacity: 0.6; font-size: 13px; margin-left: 6px; }
  section { padding: 10px 28px 18px; }
  h2 { font-size: 17px; margin: 8px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  .portrait { margin: 0; text-align: center; }
  .portrait svg { width: 230px; height: 230px; display: block; }
  figcaption { font-weight: 700; display: flex; gap: 10px; justify-content: center; align-items: center; }
  .chips i, .sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid #0003; vertical-align: -3px; margin-right: 3px; }
  .trio { display: flex; gap: 4px; flex-wrap: wrap; width: 486px; }
  .trio p { width: 100%; margin: 2px 0 0; font-weight: 700; text-align: center; }
  .faces { display: flex; gap: 4px; flex-wrap: wrap; width: 486px; }
  .faces svg { width: 158px; height: 145px; background: #EADFCB; border-radius: 8px; }
  .faces p { width: 100%; margin: 2px 0 0; font-weight: 700; text-align: center; }
  .fig { position: relative; width: 158px; height: 190px; background: #EADFCB; border-radius: 8px; overflow: hidden; }
  .fig.light { background: #F1E8D8; }
  .fig svg { width: 210px; height: 210px; margin: -6px 0 0 -26px; }
  .fig span { position: absolute; top: 4px; left: 8px; font-size: 12px; opacity: 0.7; z-index: 1; }
  .set { display: flex; gap: 4px; flex-wrap: wrap; width: 488px; }
  .set p { width: 100%; margin: 2px 0 0; font-weight: 700; text-align: center; }
  .fig.small { width: 118px; height: 150px; }
  .fig.small svg { width: 160px; height: 160px; margin: -4px 0 0 -21px; }
  .noir { background: var(--night); color: #E9E2D4; }
  .sizes { gap: 34px; }
  .pair { display: flex; gap: 6px; align-items: flex-end; }
  .tiny svg { width: 84px; height: 84px; display: block; }
  .icons { display: flex; flex-direction: column; gap: 6px; margin-left: 10px; }
  .note { font-size: 13px; opacity: 0.75; margin: 10px 0 0; }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { padding: 5px 14px 5px 0; text-align: left; border-bottom: 1px solid #0002; }
  /* The motion view: three characters on a noir stage. */
  html[data-view="motion"] body { background: var(--night); overflow: hidden; }
  .stage { position: relative; width: 1280px; height: 720px; display: flex; justify-content: center; gap: 0; background: radial-gradient(ellipse 70% 60% at 50% 40%, #2A2E3B 0%, #171A23 60%, #0E1016 100%); }
  .col { position: relative; width: 410px; height: 720px; }
  .spot { position: absolute; left: 55px; top: 120px; width: 300px; height: 470px; background: radial-gradient(ellipse 50% 50% at 50% 55%, #F2C14E22 0%, #F2C14E0A 45%, transparent 70%); }
  .figure svg { position: absolute; left: -10px; top: 40px; width: 430px; height: 430px; transform: scale(1.36); transform-origin: 50% 0%; }
  .who { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 12px; color: #E9E2D4; font-size: 22px; }
  .action { position: absolute; top: 26px; left: 0; right: 0; text-align: center; color: #F2C14E; font: 800 26px/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
  .mark { position: absolute; right: 18px; bottom: 10px; color: #E9E2D466; font-size: 12px; }
  /* The crew's sheet and stage: the same parts, nine across. */
  .portrait.crew svg { width: 150px; height: 150px; }
  .duo { display: flex; gap: 4px; flex-wrap: wrap; width: 324px; }
  .duo p, .set.crew p { width: 100%; margin: 2px 0 0; font-weight: 700; text-align: center; }
  .set.crew { width: 366px; }
  html[data-view="crew-motion"] body { background: var(--night); overflow: hidden; }
  .stage.crew .col { width: 136px; }
  .stage.crew .spot { left: 3px; top: 150px; width: 130px; height: 430px; }
  .stage.crew .figure svg { left: -82px; top: 92px; width: 300px; height: 300px; }
  .stage.crew .who { bottom: 44px; flex-direction: column; gap: 6px; font-size: 16px; }
</style>
</head>
<body>
<main id="pilot" aria-label="Character pilot review"></main>
<script type="module" src="./review.mjs"></script>
</body>
</html>
