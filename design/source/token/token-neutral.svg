<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · token-neutral
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.

  The public player token. It is the same for every seat and every role: nothing on it may
  ever depend on a role, a faction, a resource or a private choice.

  The two top-level groups only lay the sheet out. Layers are their direct children and are
  picked by id in design/source/export-recipes.json; each carries its own paint. Layers that are not part of the idle
  picture carry display="none" so the file opens showing an idle token; the export removes it.
  No text lives in this file: the numeral comes from numerals.svg or from live text.

  Palette (design tokens 0.3.0): ink #151923 · publicToken #C6CDD4 · paper #F4EBDD ·
  paperDeep #CBBBA2 · steelMid #55657E · steelShadow #34415A · interactiveAccent #F1B84B
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <pattern id="halftone-ink-fine" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.05" fill="#151923"/>
    </pattern>
  </defs>

  <!-- Flat badge: lists, controls, print. Center of the face is 38,38. -->
  <g id="artboard-badge" data-viewbox="0 0 80 80" transform="translate(10 10)">
    <g id="badge-shadow">
      <circle cx="42" cy="42" r="30" fill="#151923"/>
    </g>
    <g id="badge-body">
      <circle cx="38" cy="38" r="30" fill="#C6CDD4" stroke="#151923" stroke-width="4"/>
    </g>
    <g id="badge-shade">
      <path d="M59.65 25.5 A25 25 0 0 1 25.5 59.65" fill="none" stroke="url(#halftone-ink-fine)" stroke-width="6.5"/>
    </g>
    <g id="badge-highlight">
      <path d="M14.04 29.28 A25.5 25.5 0 0 1 29.28 14.04" fill="none" stroke="#F4EBDD" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="badge-face">
      <circle cx="38" cy="38" r="21" fill="#F4EBDD" stroke="#151923" stroke-width="2.5"/>
    </g>

    <!-- Public health, always paired with its labeled marker. Injured adds to the badge. -->
    <g id="health-injured" display="none">
      <path d="M60 16 L55 22 L59.5 25 L55.5 29.5" fill="none" stroke="#151923" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
      <g transform="translate(19.6 56.4) rotate(-45)">
        <rect x="-9" y="-4.5" width="18" height="9" rx="2" fill="#F4EBDD" stroke="#151923" stroke-width="2"/>
        <path d="M-3 -4.5 V4.5 M3 -4.5 V4.5" fill="none" stroke="#151923" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Eliminated replaces shadow, body, shade and highlight: a flat, hollow token. -->
    <g id="eliminated-body" display="none">
      <circle cx="38" cy="38" r="30" fill="#34415A" stroke="#151923" stroke-width="4"/>
      <circle cx="38" cy="38" r="30" fill="none" stroke="#CBBBA2" stroke-width="2" stroke-dasharray="5 4.4"/>
      <path d="M13 21 L20 28 M56 48 L63 55" fill="none" stroke="#CBBBA2" stroke-width="3" stroke-linecap="square"/>
    </g>
    <g id="eliminated-face" display="none">
      <circle cx="38" cy="38" r="21" fill="#CBBBA2" stroke="#151923" stroke-width="2.5"/>
    </g>

    <!-- Private emphasis. Drawn only inside the player's own private sheet, never on a public surface. -->
    <g id="ring-targetable" display="none">
      <circle cx="38" cy="38" r="35.5" fill="none" stroke="#151923" stroke-width="5" stroke-dasharray="7 5.39"/>
      <circle cx="38" cy="38" r="35.5" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-dasharray="7 5.39"/>
    </g>
    <g id="ring-selected" display="none">
      <circle cx="38" cy="38" r="35.5" fill="none" stroke="#151923" stroke-width="7"/>
      <circle cx="38" cy="38" r="35.5" fill="none" stroke="#F1B84B" stroke-width="4"/>
    </g>
    <g id="dim-unavailable" display="none">
      <circle cx="38" cy="38" r="30" fill="#55657E" stroke="#151923" stroke-width="4"/>
      <circle cx="38" cy="38" r="21" fill="#CBBBA2" stroke="#151923" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Standee: the same badge on a stand, for the board. Origin (floor contact) is 48,104. -->
  <g id="artboard-standee" data-viewbox="0 0 96 120" transform="translate(120 10)">
    <g id="standee-floor-shadow">
      <ellipse cx="53" cy="108" rx="30" ry="8.5" fill="#151923"/>
    </g>
    <g id="standee-base">
      <path d="M24 100 V104 A24 7.5 0 0 0 72 104 V100 Z" fill="#55657E" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="48" cy="100" rx="24" ry="7.5" fill="#C6CDD4" stroke="#151923" stroke-width="3"/>
    </g>
    <g id="standee-neck">
      <path d="M41 68 H55 L58 100 H38 Z" fill="#55657E" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M52 72 L54.5 98" fill="none" stroke="#151923" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="standee-badge" transform="translate(10 6)">
      <circle cx="42" cy="42" r="30" fill="#151923"/>
      <circle cx="38" cy="38" r="30" fill="#C6CDD4" stroke="#151923" stroke-width="4"/>
      <path d="M59.65 25.5 A25 25 0 0 1 25.5 59.65" fill="none" stroke="url(#halftone-ink-fine)" stroke-width="6.5"/>
      <path d="M14.04 29.28 A25.5 25.5 0 0 1 29.28 14.04" fill="none" stroke="#F4EBDD" stroke-width="3" stroke-linecap="round"/>
      <circle cx="38" cy="38" r="21" fill="#F4EBDD" stroke="#151923" stroke-width="2.5"/>
    </g>
    <g id="standee-health-injured" display="none" transform="translate(10 6)">
      <path d="M60 16 L55 22 L59.5 25 L55.5 29.5" fill="none" stroke="#151923" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
      <g transform="translate(19.6 56.4) rotate(-45)">
        <rect x="-9" y="-4.5" width="18" height="9" rx="2" fill="#F4EBDD" stroke="#151923" stroke-width="2"/>
        <path d="M-3 -4.5 V4.5 M3 -4.5 V4.5" fill="none" stroke="#151923" stroke-width="1.5"/>
      </g>
    </g>
    <!-- Eliminated on the board: the stand stays, the badge goes flat and hollow, no floor shadow. -->
    <g id="standee-eliminated-badge" display="none" transform="translate(10 6)">
      <circle cx="38" cy="38" r="30" fill="#34415A" stroke="#151923" stroke-width="4"/>
      <circle cx="38" cy="38" r="30" fill="none" stroke="#CBBBA2" stroke-width="2" stroke-dasharray="5 4.4"/>
      <path d="M13 21 L20 28 M56 48 L63 55" fill="none" stroke="#CBBBA2" stroke-width="3" stroke-linecap="square"/>
      <circle cx="38" cy="38" r="21" fill="#CBBBA2" stroke="#151923" stroke-width="2.5"/>
    </g>
  </g>
</svg>
