<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · token numerals 1–9
  Original vector lettering made for this repository: drawn as centerline strokes, not taken
  from any font. Rights and provenance: design/exports/asset-manifest.json.

  Each numeral sits in a 40 x 48 cell. The body runs from y 4 to y 41 and its optical
  center is 20,22.5. 6 and 9 carry a baseline bar so a token read from the far side of a
  table is not mistaken for the other.
  A numeral is a seat number, which is public. It is never a count of anything private.

  Each numeral group carries its own paint and no transform, so it can be lifted out whole.
  The wrappers around them only lay the sheet out.

  Palette: ink #151923
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 68" width="440" height="68">
  <g id="sheet-numerals" transform="translate(10 10)">
    <g transform="translate(0 0)">
      <g id="numeral-1" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M22 37.5 V4"/>
        <path d="M22 7.5 L11 16"/>
        <path d="M12 37.5 H32" stroke-width="6"/>
      </g>
    </g>
    <g transform="translate(46 0)">
      <g id="numeral-2" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M9 16 A11 10 0 0 1 31 16 C31 23.5 19 28.5 9 37.5 H32"/>
      </g>
    </g>
    <g transform="translate(92 0)">
      <g id="numeral-3" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M9 11.5 C13 5.3 31 4.8 31 14.2 C31 20 24 22.3 17 22.3 C25 22.3 32 24.5 32 30.3 C32 40.2 12 40.2 8 33"/>
      </g>
    </g>
    <g transform="translate(138 0)">
      <g id="numeral-4" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M26 37.5 V4"/>
        <path d="M26 7.5 L8 29 H33"/>
      </g>
    </g>
    <g transform="translate(184 0)">
      <g id="numeral-5" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M30 7.5 H12.5 L10.5 20.5 C17 17 32 17.8 32 28.1 C32 39.7 13.5 40.2 8 33"/>
      </g>
    </g>
    <g transform="translate(230 0)">
      <g id="numeral-6" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M28 8.5 C17.5 5.8 9.5 12.5 9.5 23.5 C9.5 41.5 30.5 41.5 30.5 27.5 C30.5 17 13 16.5 9.8 25.5"/>
        <path d="M12.5 45.75 H27.5" stroke-width="2.5"/>
      </g>
    </g>
    <g transform="translate(276 0)">
      <g id="numeral-7" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M8 7.5 H31.5 L17 37.5"/>
      </g>
    </g>
    <g transform="translate(322 0)">
      <g id="numeral-8" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <ellipse cx="20" cy="14.3" rx="9" ry="7"/>
        <ellipse cx="20" cy="29.3" rx="11" ry="8.2"/>
      </g>
    </g>
    <g transform="translate(368 0)">
      <g id="numeral-9" fill="none" stroke="#151923" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt">
        <path d="M12 36.5 C22.5 39.2 30.5 32.5 30.5 21.5 C30.5 3.5 9.5 3.5 9.5 17.5 C9.5 28 27 28.5 30.2 19.5"/>
        <path d="M12.5 45.75 H27.5" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>
