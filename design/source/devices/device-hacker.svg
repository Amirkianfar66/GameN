<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · device-hacker · Hacker (Red team)
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.
  The game owner approved the role card as a device on 7 October 2026 (docs/design/owner-decisions.md).

  PRIVATE. A role is shown as a device added to the player's own character, and only on that
  player's own screen, inside the private card. It is never drawn on a piece on the board,
  on the shared display or in a public cue. Every phone loads all nine in the one role bundle,
  whatever its role.

  It says: scanning for four. A scanner with four slots, two of them lit.

  The hand and sleeve are the crew suit every character wears, so one drawing serves all nine
  characters. The accent is the team color, allowed here because the view is private.
  No text is drawn. 120 x 140; laid over the lower right of the character.
  Parts a renderer may move: device-hacker-glow (its lights), device-hacker-head (the device), device-hacker-arm (hand and sleeve).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <pattern id="device-hacker-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.85" fill="#151923"/>
    </pattern>
  </defs>
  <g id="device-hacker-all">
    <g id="device-hacker-arm">
      <polygon points="64,103 92,97 126,150 80,150" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="84,118 98,107 126,150 100,150" fill="url(#device-hacker-dots)" opacity="0.6"/>
      <polygon points="64.5,104 92,98 96.5,105.5 69,112" fill="#FF8C8C" stroke="#151923" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="device-hacker-head">
      <rect x="66" y="56" width="12" height="60" rx="4" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <path d="M69.5 60 V72" fill="none" stroke="#8696AE" stroke-width="2" stroke-linecap="round"/>
      <path d="M88 30 L99 7" fill="none" stroke="#151923" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M88 30 L99 7" fill="none" stroke="#B9C4D3" stroke-width="2" stroke-linecap="round"/>
      <circle cx="99.5" cy="6" r="4" fill="#F4EBDD" stroke="#151923" stroke-width="2.2"/>
      <path id="device-hacker-glow" d="M40 18 Q46 8 56 4 M46 23 Q50 16 58 12" fill="none" stroke="#FF8C8C" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="48" y="27" width="48" height="35" rx="7" fill="#B9C4D3" stroke="#151923" stroke-width="3"/>
      <path d="M88 28 Q96 29 96 35 V54 Q96 62 88 62 H82 Q90 46 88 28 Z" fill="url(#device-hacker-dots)" opacity="0.5"/>
      <rect x="53.5" y="33" width="37" height="19" rx="4" fill="#151923"/>
      <g id="device-hacker-lit"><rect x="57.5" y="37" width="6" height="11" rx="1.5" fill="#FF8C8C"/><rect x="66" y="37" width="6" height="11" rx="1.5" fill="#FF8C8C"/></g>
      <rect x="74.5" y="37" width="6" height="11" rx="1.5" fill="#55657E"/><rect x="83" y="37" width="6" height="11" rx="1.5" fill="#55657E"/>
      <circle cx="57" cy="57" r="2.2" fill="#F4EBDD" stroke="#151923" stroke-width="1.4"/><circle cx="64.5" cy="57" r="2.2" fill="#34415A" stroke="#151923" stroke-width="1.4"/>
    </g>
    <g id="device-hacker-fist">
      <path d="M55 84 Q55 75 64 75 H81 Q90 75 90 85 V98 Q90 107 81 107 H64 Q55 107 55 98 Z" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 76 H82 Q90 76 90 85 V98 Q90 107 82 107 H76 Q82 92 78 76 Z" fill="url(#device-hacker-dots)" opacity="0.55"/>
      <path d="M59 84.5 H78 M59 91.5 H78 M59 98.5 H78" fill="none" stroke="#151923" stroke-width="1.9" stroke-linecap="round"/>
      <rect x="52" y="69" width="26" height="11" rx="5.5" fill="#C6CDD4" stroke="#151923" stroke-width="2.8" transform="rotate(-10 65 74.5)"/>
    </g>
  </g>
</svg>
