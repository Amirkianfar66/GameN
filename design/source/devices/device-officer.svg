<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · device-officer · Officer (Blue team)
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.
  The game owner approved the role card as a device on 7 October 2026 (docs/design/owner-decisions.md).

  PRIVATE. A role is shown as a device added to the player's own character, and only on that
  player's own screen, inside the private card. It is never drawn on a piece on the board,
  on the shared display or in a public cue. Every phone loads all nine in the one role bundle,
  whatever its role.

  It says one thing: one shot. A sidearm held at rest, muzzle up and away, one charge cell in its chamber. Nobody is aimed at and nothing fires.

  The hand and sleeve are the crew suit every character wears, so one drawing serves all nine
  characters. The accent is the team color, allowed here because the view is private.
  No text is drawn. 120 x 140; laid over the lower right of the character.
  Parts a renderer may move: device-officer-glow (its lights), device-officer-head (the device), device-officer-arm (hand and sleeve).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <pattern id="device-officer-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.85" fill="#151923"/>
    </pattern>
  </defs>
  <g id="device-officer-all" transform="rotate(-24 72 98)">
    <g id="device-officer-arm">
      <polygon points="64,103 92,97 126,150 80,150" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="84,118 98,107 126,150 100,150" fill="url(#device-officer-dots)" opacity="0.6"/>
      <polygon points="64.5,104 92,98 96.5,105.5 69,112" fill="#70AFFF" stroke="#151923" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="device-officer-head">
      <rect x="66" y="56" width="12" height="60" rx="4" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <path d="M69.5 60 V72" fill="none" stroke="#8696AE" stroke-width="2" stroke-linecap="round"/>
      <rect x="52" y="45" width="9" height="13" rx="2.5" fill="#55657E" stroke="#151923" stroke-width="2.6"/>
      <rect x="57" y="40" width="60" height="19" rx="5.5" fill="#B9C4D3" stroke="#151923" stroke-width="3"/>
      <path d="M62 53 H112 Q117 53 117 53.5 V53.5 Q117 59 111.5 59 H62.5 Q57 59 57 53.5 Z" fill="#8696AE"/>
      <rect x="57" y="40" width="60" height="19" rx="5.5" fill="none" stroke="#151923" stroke-width="3"/>
      <rect x="113" y="43" width="7" height="13" rx="2" fill="#55657E" stroke="#151923" stroke-width="2.4"/>
      <rect x="67" y="33" width="32" height="8.5" rx="2" fill="#8696AE" stroke="#151923" stroke-width="2.4"/>
      <path d="M74 35.5 V39.5 M81 35.5 V39.5 M88 35.5 V39.5" fill="none" stroke="#151923" stroke-width="1.6"/>
      <rect x="73" y="43.5" width="26" height="12" rx="4.5" fill="#151923"/>
      <rect id="device-officer-glow" x="76" y="46" width="20" height="7" rx="3" fill="#70AFFF" stroke="#F4EBDD" stroke-width="1.2"/>
      <path d="M104 45.5 V52 M108 45.5 V52" fill="none" stroke="#151923" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M80 59 C80 72 96 72 96 59" fill="none" stroke="#151923" stroke-width="3" stroke-linecap="round"/>
      <path d="M61 44.5 H69" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="device-officer-fist">
      <path d="M55 84 Q55 75 64 75 H81 Q90 75 90 85 V98 Q90 107 81 107 H64 Q55 107 55 98 Z" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 76 H82 Q90 76 90 85 V98 Q90 107 82 107 H76 Q82 92 78 76 Z" fill="url(#device-officer-dots)" opacity="0.55"/>
      <path d="M59 84.5 H78 M59 91.5 H78 M59 98.5 H78" fill="none" stroke="#151923" stroke-width="1.9" stroke-linecap="round"/>
      <rect x="52" y="69" width="26" height="11" rx="5.5" fill="#C6CDD4" stroke="#151923" stroke-width="2.8" transform="rotate(-10 65 74.5)"/>
    </g>
  </g>
</svg>
