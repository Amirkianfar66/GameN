    <path d="M44.4 49.6 Q48 52.2 51.6 49.6" fill="none" stroke="#151923" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <g id="crew-8-clamp">
    <path d="M27 87.5 H69 V98.5 Q48 104.5 27 98.5 Z" fill="#55657E" stroke="#151923" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M54 87.5 H69 V98.5 Q62 100.8 54 101.8 Z" fill="url(#crew-8-dots-ink)" opacity="0.7"/>
    <path d="M31 90.5 H50" fill="none" stroke="#B9C4D3" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
