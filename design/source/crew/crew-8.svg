<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · piece-crew · character c8 ("Mira", a proposed call sign)
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.
  The game owner approved the nine characters on 7 October 2026 (docs/design/owner-decisions.md).

  A PUBLIC playing piece: a cardboard standee in a plastic stand. A player picks one of nine
  before roles are dealt. It says who a piece belongs to and nothing else: it has no rank,
  no badge, no tool, no weapon and nothing of a role or a team about it, and every one of
  the nine wears the same crew suit. Its field color is none of blue, red or violet, the hues
  of the three team accents; how near each field comes to an accent is measured, not assumed
  (packages/design-tokens/test/tokens.test.mjs).

  No text is drawn. The player's name and seat number are live text beside the piece.
  96 x 120, the box of the numbered standee, which stays as the piece of a seat that has no
  character yet; floor contact at 48,104.
  Layers, back to front: crew-8-stand, crew-8-card, crew-8-figure, crew-8-clamp. crew-8-eyes is a group of its own, so that a renderer may move it (a blink).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120">
  <defs>
    <pattern id="crew-8-dots-paper" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#F4EBDD"/>
    </pattern>
    <pattern id="crew-8-dots-ink" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.8" fill="#151923"/>
    </pattern>
    <clipPath id="crew-8-clip-card">
      <path d="M17 90 V40 A31 31 0 0 1 79 40 V90 Z"/>
    </clipPath>
  </defs>

  <g id="crew-8-stand">
    <ellipse cx="50.5" cy="108.5" rx="30" ry="8" fill="#151923"/>
    <ellipse cx="48" cy="106" rx="29" ry="8" fill="#34415A" stroke="#151923" stroke-width="2.6"/>
    <ellipse cx="48" cy="103.5" rx="29" ry="8" fill="#8696AE" stroke="#151923" stroke-width="2.6"/>
    <path d="M26 101 C32 98.4 40 97.4 48 97.4" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g id="crew-8-card">
