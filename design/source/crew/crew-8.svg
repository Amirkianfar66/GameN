    <path d="M12 90 V40 A36 36 0 0 1 84 40 V90 Z" fill="#F4EBDD" stroke="#151923" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M17 90 V40 A31 31 0 0 1 79 40 V90 Z" fill="#E3D6C2"/>
    <g clip-path="url(#crew-8-clip-card)">
