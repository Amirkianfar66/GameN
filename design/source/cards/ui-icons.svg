<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · interface icons and resource pips
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.

  Small marks for controls. None is ever the only way a thing is said: each sits beside its
  English label, which is live text.

    icon-action-shot       the Shot action card. The same card and the same icon for every
                           seat that is shown the card; it is not an Officer emblem.
    icon-private-closed    the private sheet is closed (the default)
    icon-private-open      the private sheet is open
    icon-connection-stale  the view is the last known one and may be out of date
    pip-available          one unit of a resource the view says is available
    pip-registered         that unit is reserved by a registered command. Not an outcome.
    pip-spent              that unit is used up

  The three pips differ in outline and fill pattern, not in color: solid, dotted, struck out.
  A pip is drawn only from what the player's own view states. It is private.

  Each icon group carries its own paint and no transform, in a 32 x 32 cell (pips: 36 x 20).
  Single-color icons are drawn in ink and exported in ink, in paper and as a tintable symbol.

  Palette (design tokens 0.3.0): ink #151923 · paper #F4EBDD
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <defs>
    <pattern id="halftone-ink-pip" width="3.6" height="3.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="1.8" cy="1.8" r="1.05" fill="#151923"/>
    </pattern>
  </defs>
  <g id="sheet-ui-icons" transform="translate(10 14)">
    <g transform="translate(0 0)">
      <g id="icon-action-shot" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round">
        <circle cx="16" cy="16" r="9.5"/>
        <path d="M16 2.5 V9 M16 23 V29.5 M2.5 16 H9 M23 16 H29.5"/>
        <circle cx="16" cy="16" r="2.2" fill="#151923" stroke="none"/>
      </g>
    </g>
    <g transform="translate(44 0)">
      <g id="icon-private-closed" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 13 C9 21 23 21 28 13"/>
        <path d="M8.5 18.5 L6 23 M16 20 V25 M23.5 18.5 L26 23"/>
      </g>
    </g>
    <g transform="translate(88 0)">
      <g id="icon-private-open" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 16 C9 7.5 23 7.5 28.5 16 C23 24.5 9 24.5 3.5 16 Z"/>
        <circle cx="16" cy="16" r="4.2" fill="#151923" stroke="none"/>
      </g>
    </g>
    <g transform="translate(132 0)">
      <g id="icon-connection-stale" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 25 V20 M14 25 V14 M21 25 V8" stroke-width="4"/>
        <path d="M4.5 4.5 L27.5 27.5"/>
      </g>
    </g>
    <g transform="translate(180 6)">
      <g id="pip-available">
        <rect x="2" y="3" width="29" height="14" rx="5" fill="#151923" stroke="#151923" stroke-width="2.4"/>
        <rect x="31.5" y="7" width="3" height="6" rx="1" fill="#151923"/>
        <path d="M7.5 7.5 H18" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(224 6)">
      <g id="pip-registered">
        <rect x="2" y="3" width="29" height="14" rx="5" fill="#F4EBDD"/>
        <rect x="2" y="3" width="29" height="14" rx="5" fill="url(#halftone-ink-pip)"/>
        <rect x="2" y="3" width="29" height="14" rx="5" fill="none" stroke="#151923" stroke-width="2.4"/>
        <rect x="31.5" y="7" width="3" height="6" rx="1" fill="#151923"/>
      </g>
    </g>
    <g transform="translate(268 6)">
      <g id="pip-spent">
        <rect x="2" y="3" width="29" height="14" rx="5" fill="#F4EBDD" stroke="#151923" stroke-width="2" stroke-dasharray="3.2 2.4"/>
        <rect x="31.5" y="7" width="3" height="6" rx="1" fill="#151923"/>
        <path d="M6 18.5 L28 1.5" fill="none" stroke="#F4EBDD" stroke-width="5.4" stroke-linecap="round"/>
        <path d="M6 18.5 L28 1.5" fill="none" stroke="#151923" stroke-width="2.6" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
