<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · card-officer (private role illustration)
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.

  PRIVATE ARTWORK. It is shown only inside a player's own private sheet, to the seat that
  holds the Officer role. It is delivered in the uniform role bundle that every phone
  loads whatever its role, so fetching it tells nobody anything.

  The picture says one thing: one shot. A sidearm at rest with a single charge cell in its
  chamber. It is not firing, because holding the card is not an outcome. Nothing in it
  refers to identifying another player.

  No text is drawn. The role name, team, summary and shot count are live English text in
  the card's own DOM (proposed copy: design/contract/copy.en.proposed.json).

  The blue accent is the Blue faction color. It is allowed here because this is an
  authorized private view of the player's own role; it never appears on a public asset.

  5:7 illustration, 500 x 700. Layers back to front:
    officer-ground    paper field and burst
    officer-band      the dark lower band
    officer-spot      the disc behind the sidearm
    officer-shadow    the sidearm's ink shadow
    officer-sidearm   the sidearm and its one cell
    officer-insignia  rank roundel with two chevrons (not a shield: a shield reads as protection)
    officer-keyline   inked edge of the illustration

  Palette (design tokens 0.3.0): ink #151923 · paper #F4EBDD · paperShade #E3D6C2 ·
  paperDeep #CBBBA2 · steelDeep #222B3A · steelShadow #34415A · steelMid #55657E ·
  steelLight #8696AE · steelPale #B9C4D3 · factionPrivateOrRevealed.blue #70AFFF
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <pattern id="halftone-ink-card-s" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="1.4" fill="#151923"/>
    </pattern>
    <pattern id="halftone-ink-card-m" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="2.3" fill="#151923"/>
    </pattern>
    <pattern id="halftone-paper-card-s" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="1.5" fill="#F4EBDD"/>
    </pattern>
    <pattern id="halftone-paper-card-m" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="2.4" fill="#F4EBDD"/>
    </pattern>
    <clipPath id="clip-officer-card">
      <rect x="0" y="0" width="500" height="700" rx="14"/>
    </clipPath>
    <clipPath id="clip-officer-spot">
      <circle cx="250" cy="318" r="169"/>
    </clipPath>
    <clipPath id="clip-officer-receiver">
      <rect x="40" y="40" width="292" height="62" rx="10"/>
    </clipPath>
  </defs>

  <g id="officer-ground" clip-path="url(#clip-officer-card)">
    <rect x="0" y="0" width="500" height="700" fill="#F4EBDD"/>
    <g fill="#E3D6C2">
      <polygon points="66.9,360.5 -329.6,473.3 -342.6,411.9 65.4,353.7"/>
      <polygon points="69.1,267.0 -332.7,174.9 -314.5,114.8 71.0,260.4"/>
      <polygon points="116.0,186.1 -191.7,-88.1 -146.8,-132.1 120.9,181.3"/>
      <polygon points="196.1,137.9 58.6,-250.7 119.1,-267.6 202.8,136.0"/>
      <polygon points="289.6,134.2 356.3,-272.5 417.4,-258.2 296.3,135.8"/>
      <polygon points="373.2,176.0 627.6,-148.3 674.3,-106.3 378.3,180.6"/>
      <polygon points="426.4,252.9 805.5,91.3 826.2,150.6 428.6,259.4"/>
      <polygon points="435.9,346.0 846.0,387.0 835.6,448.9 434.8,352.7"/>
    </g>
    <g fill="#151923">
      <polygon points="62.1,311.8 -349.9,308.6 -348.6,277.2 62.2,308.4"/>
      <polygon points="88.3,222.1 -271.2,20.7 -254.9,-6.1 90.1,219.1"/>
      <polygon points="154.5,156.1 -63.5,-193.6 -36.3,-209.3 157.5,154.3"/>
      <polygon points="244.3,130.1 221.7,-281.3 253.1,-282.0 247.8,130.0"/>
      <polygon points="335.6,150.6 514.0,-220.8 541.8,-206.3 338.6,152.2"/>
      <polygon points="405.6,212.5 740.9,-27.0 758.3,-0.8 407.5,215.4"/>
      <polygon points="437.2,300.6 846.4,252.2 849.0,283.5 437.5,304.0"/>
    </g>
    <!-- Halftone gathers in the top corners. -->
    <path d="M0 0 H180 L0 150 Z" fill="url(#halftone-ink-card-s)"/>
    <path d="M0 0 H96 L0 80 Z" fill="url(#halftone-ink-card-m)"/>
    <path d="M500 0 H360 L500 116 Z" fill="url(#halftone-ink-card-s)"/>
  </g>

  <g id="officer-band" clip-path="url(#clip-officer-card)">
    <polygon points="0,522 500,404 500,700 0,700" fill="#222B3A"/>
    <polygon points="0,522 500,404 500,446 0,564" fill="url(#halftone-paper-card-m)" opacity="0.55"/>
    <polygon points="0,564 500,446 500,486 0,604" fill="url(#halftone-paper-card-s)" opacity="0.45"/>
    <!-- Two rank stripes run with the band. -->
    <polygon points="0,612 500,494 500,508 0,626" fill="#F4EBDD"/>
    <polygon points="0,638 500,520 500,526 0,644" fill="#F4EBDD"/>
    <path d="M0 522 L500 404" fill="none" stroke="#151923" stroke-width="7"/>
  </g>

  <g id="officer-spot">
    <circle cx="258" cy="328" r="172" fill="#151923"/>
    <circle cx="250" cy="318" r="172" fill="#E3D6C2" stroke="#151923" stroke-width="6"/>
    <g clip-path="url(#clip-officer-spot)">
      <path d="M250 318 L440 250 L440 520 L170 520 Z" fill="#CBBBA2"/>
      <path d="M300 300 L440 250 L440 520 L250 520 Z" fill="url(#halftone-ink-card-s)"/>
      <path d="M360 330 L440 300 L440 520 L330 520 Z" fill="url(#halftone-ink-card-m)"/>
      <circle cx="250" cy="318" r="150" fill="none" stroke="#151923" stroke-width="2" opacity="0.4"/>
    </g>
  </g>

  <g id="officer-shadow" transform="translate(264 344) rotate(-22) translate(-198 -116)">
    <path fill-rule="evenodd" d="M26 48 H40 V40 H76 V26 H246 V40 H292 V26 H310 V40 H330 V48 H358 V56 H366 V86 H358 V94 H332 V102 H320 V118 H210 C204 150 142 152 142 100 L118 208 Q116 216 108 216 H50 Q40 216 42 206 L66 100 H50 Q40 102 40 92 V88 H26 Z M152 106 C154 138 196 138 200 106 Z" fill="#151923" stroke="#151923" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <g id="officer-sidearm" transform="translate(250 326) rotate(-22) translate(-198 -116)">
    <!-- Grip. -->
    <path d="M66 96 H142 L118 208 Q116 216 108 216 H50 Q40 216 42 206 Z" fill="#34415A" stroke="#151923" stroke-width="6" stroke-linejoin="round"/>
    <path d="M70 132 L122 132 M64 158 L116 158 M58 184 L110 184" fill="none" stroke="#151923" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M118 108 L98 204" fill="none" stroke="#55657E" stroke-width="5" stroke-linecap="round"/>
    <!-- Trigger guard and trigger. -->
    <path d="M142 100 C142 152 204 152 210 100" fill="none" stroke="#151923" stroke-width="7" stroke-linecap="round"/>
    <path d="M168 102 C166 118 172 128 181 130" fill="none" stroke="#151923" stroke-width="5" stroke-linecap="round"/>
    <!-- Under-barrel. -->
    <rect x="208" y="98" width="112" height="20" rx="4" fill="#55657E" stroke="#151923" stroke-width="5"/>
    <!-- Rear block and muzzle. -->
    <rect x="26" y="48" width="20" height="40" rx="4" fill="#55657E" stroke="#151923" stroke-width="5"/>
    <rect x="328" y="48" width="30" height="46" rx="4" fill="#55657E" stroke="#151923" stroke-width="5"/>
    <rect x="356" y="56" width="10" height="30" rx="3" fill="#151923"/>
    <!-- Receiver. -->
    <rect x="40" y="40" width="292" height="62" rx="10" fill="#B9C4D3"/>
    <g clip-path="url(#clip-officer-receiver)">
      <rect x="40" y="80" width="292" height="24" fill="#8696AE"/>
      <rect x="246" y="80" width="90" height="24" fill="url(#halftone-ink-card-s)"/>
    </g>
    <rect x="40" y="40" width="292" height="62" rx="10" fill="none" stroke="#151923" stroke-width="6"/>
    <path d="M56 51 H136 M250 51 H318" fill="none" stroke="#F4EBDD" stroke-width="4" stroke-linecap="round"/>
    <!-- Rail and sights. -->
    <rect x="76" y="26" width="170" height="16" rx="3" fill="#8696AE" stroke="#151923" stroke-width="4"/>
    <path d="M96 30 V38 M116 30 V38 M136 30 V38 M156 30 V38 M176 30 V38 M196 30 V38 M216 30 V38" fill="none" stroke="#151923" stroke-width="2.5"/>
    <rect x="292" y="26" width="18" height="16" rx="2" fill="#34415A" stroke="#151923" stroke-width="4"/>
    <!-- The chamber, and the one cell in it. -->
    <rect x="146" y="50" width="94" height="42" rx="9" fill="#151923"/>
    <rect x="156" y="58" width="74" height="26" rx="7" fill="#70AFFF" stroke="#F4EBDD" stroke-width="2.5"/>
    <path d="M165 65.5 H206" fill="none" stroke="#F4EBDD" stroke-width="3" stroke-linecap="round"/>
    <!-- Vents. -->
    <path d="M258 60 V74 M270 60 V74 M282 60 V74 M294 60 V74 M306 60 V74" fill="none" stroke="#151923" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <g id="officer-insignia" transform="translate(34 544) scale(3.7)">
    <circle cx="18" cy="18.5" r="13.5" fill="#151923"/>
    <circle cx="16" cy="16.5" r="13.5" fill="#F4EBDD" stroke="#151923" stroke-width="2.4"/>
    <path d="M9.5 15.5 L16 9.5 L22.5 15.5 M9.5 22 L16 16 L22.5 22" fill="none" stroke="#151923" stroke-width="5.2" stroke-linejoin="miter" stroke-linecap="butt"/>
    <path d="M9.5 15.5 L16 9.5 L22.5 15.5 M9.5 22 L16 16 L22.5 22" fill="none" stroke="#70AFFF" stroke-width="2.6" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>

  <g id="officer-keyline">
    <rect x="4" y="4" width="492" height="692" rx="12" fill="none" stroke="#151923" stroke-width="8"/>
  </g>
</svg>
