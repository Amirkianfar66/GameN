<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · halftone and hatch tiles
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.

  Seamless 12 x 12 tiles for CSS backgrounds: a dot lattice at 45 degrees in three weights,
  and a diagonal hatch. Halftone is shading and hatch means "waiting"; neither ever sits
  behind small text (design tokens 0.3.0, comic.halftone.neverBehindTextSmallerThanPx).

  Each tile group carries its own paint and no transform. Dots on the tile edge are drawn
  whole and cut by the tile's own bounds on export. The wrappers lay the sheet out.

  Palette: ink #151923 (exported in ink and in paper)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 36" width="110" height="36">
  <g id="sheet-patterns" transform="translate(10 12)">
    <g transform="translate(0 0)">
      <g id="tile-halftone-fine" fill="#151923">
        <circle cx="0" cy="0" r="1.3"/><circle cx="12" cy="0" r="1.3"/><circle cx="0" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="6" cy="6" r="1.3"/>
      </g>
    </g>
    <g transform="translate(24 0)">
      <g id="tile-halftone-medium" fill="#151923">
        <circle cx="0" cy="0" r="2.1"/><circle cx="12" cy="0" r="2.1"/><circle cx="0" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="6" cy="6" r="2.1"/>
      </g>
    </g>
    <g transform="translate(48 0)">
      <g id="tile-halftone-heavy" fill="#151923">
        <circle cx="0" cy="0" r="3"/><circle cx="12" cy="0" r="3"/><circle cx="0" cy="12" r="3"/><circle cx="12" cy="12" r="3"/><circle cx="6" cy="6" r="3"/>
      </g>
    </g>
    <g transform="translate(72 0)">
      <g id="tile-hatch" fill="none" stroke="#151923" stroke-width="2.4" stroke-linecap="square">
        <path d="M-3 3 L3 -3 M-3 15 L15 -3 M9 15 L15 9"/>
      </g>
    </g>
  </g>
</svg>
