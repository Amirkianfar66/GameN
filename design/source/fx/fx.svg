<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · editable source · cue layers
  Original vector artwork made for this repository. Rights and provenance: design/exports/asset-manifest.json.

  Layers that a cue draws beside something the screen already says in words. A cue is
  emphasis only. No layer here carries a word: lettering is live text.

  AUTHORIZED (each follows a fact the audience's own view states):
    fx-ink-trail      a public move. Streaks above a token as it lands. It falls straight down,
                      so it draws no route between two rooms.
    fx-landing-puff   a public move. Dust at the floor contact as the token settles.
    fx-panel-cap      a round transition. The leading edge of an ink panel sweep.
    fx-speed-lines    a round transition. Lines behind the round heading as it is struck.

  The two synthetic disclosure studies are not here. They have a source file of their own,
  design/source/studies/studies.svg, which the export build refuses to read.

  Each layer group carries its own paint and no transform. The wrappers lay the sheet out.
  Single-color layers are drawn in ink and exported in ink, in paper and as a tintable symbol.

  Palette (design tokens 0.3.0): ink #151923 · paper #F4EBDD
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120">
  <defs>
    <pattern id="halftone-ink-fx-s" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.6" fill="#151923"/>
    </pattern>
    <pattern id="halftone-ink-fx-l" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="3.3" fill="#151923"/>
    </pattern>
  </defs>

  <g id="sheet-fx" transform="translate(10 10)">
    <!-- 96 x 80. The token it follows lands at 48,80. -->
    <g transform="translate(0 0)">
      <g id="fx-ink-trail" fill="#151923">
        <path d="M19.5 78 L22 30 L24.5 78 Z"/>
        <path d="M32.5 76 L36 8 L39.5 76 Z"/>
        <path d="M43.5 74 L48 0 L52.5 74 Z"/>
        <path d="M57.5 76 L61 12 L64.5 76 Z"/>
        <path d="M72.5 78 L75 34 L77.5 78 Z"/>
        <circle cx="29" cy="16" r="2"/>
        <circle cx="68" cy="22" r="1.7"/>
        <circle cx="12" cy="52" r="1.5"/>
        <circle cx="85" cy="56" r="1.5"/>
      </g>
    </g>
    <!-- 120 x 36. Floor contact at 60,30. -->
    <g transform="translate(120 20)">
      <g id="fx-landing-puff" fill="#151923">
        <path d="M50 31 C34 33 16 30 6 14 C18 24 34 26 50 25 Z"/>
        <path d="M70 31 C86 33 104 30 114 14 C102 24 86 26 70 25 Z"/>
        <circle cx="3" cy="8" r="2.2"/>
        <circle cx="117" cy="8" r="2.2"/>
        <circle cx="22" cy="6" r="1.6"/>
        <circle cx="98" cy="6" r="1.6"/>
      </g>
    </g>
    <!-- 160 x 96. The solid part is on the left; CSS continues it with a plain ink block. -->
    <g transform="translate(270 0)">
      <g id="fx-panel-cap">
        <path d="M0 0 H72 L32 96 H0 Z" fill="#151923"/>
        <path d="M70 0 H122 L82 96 H30 Z" fill="url(#halftone-ink-fx-l)"/>
        <path d="M118 0 H160 L120 96 H78 Z" fill="url(#halftone-ink-fx-s)"/>
      </g>
    </g>
    <!-- 240 x 64. Lines taper to the right. -->
    <g transform="translate(450 16)">
      <g id="fx-speed-lines" fill="#151923">
        <path d="M40 4.5 L236 6 L40 7.5 Z"/>
        <path d="M0 15.5 L200 18 L0 20.5 Z"/>
        <path d="M60 28 L240 30 L60 32 Z"/>
        <path d="M12 39 L180 42 L12 45 Z"/>
        <path d="M80 52.5 L228 54 L80 55.5 Z"/>
      </g>
    </g>
  </g>
</svg>
