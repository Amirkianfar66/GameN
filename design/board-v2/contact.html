<!doctype html>
<!-- mothership:dev-only · board-v2 contact sheet: the captures listed in review/index.json, for review. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board v2 captures</title>
  <style>
    body { margin: 0; padding: 16px; background: #0A1530; color: #F4EBDD; font: 13px/1.3 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 18px; color: #F7D886; }
    p { margin: 0 0 14px; opacity: 0.85; }
    .grid { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
    figure { margin: 0; padding: 6px; background: #10141C; border: 2px solid #E9B64E; }
    figure img { display: block; max-height: 520px; width: auto; }
    figcaption { margin-top: 4px; font-size: 11px; color: #F7D886; max-width: 300px; }
  </style>
</head>
<body>
  <h1 id="title">Board v2 proposal: fixed slots and the Hospital ward</h1>
  <p>Synthetic fixtures in desktop Chromium. Not a phone measurement, not a match.</p>
  <div class="grid" id="grid"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const group = params.get('group');
    const titles = { blackout: 'Board v2 proposal: the Blackout\'s lighting window (storyboard S1)', blocked: 'Board v2 proposal: ATTACK BLOCKED, the same for every defense (storyboard S4)', capsule: 'Board v2 proposal: the private-talk capsule (storyboard S2), synthetic participants', turns: 'Board v2 proposal: the real controls take turns with the board (the owner\'s decision of 14 October 2026); stand-ins sized from Frontend\'s measurements' };
    if (titles[group]) document.getElementById('title').textContent = titles[group];
    const index = await (await fetch('review/index.json')).json();
    const grid = document.getElementById('grid');
    // Unfiltered, every capture but the capsule's and the controls', which have their own sheets (?group=capsule, ?group=turns).
    for (const shot of index.captures.filter(entry => (group ? entry.group === group : !['capsule', 'turns'].includes(entry.group)))) {
      const figure = document.createElement('figure');
      const img = document.createElement('img');
      img.src = `review/${shot.file}`;
      img.alt = shot.about;
      img.style.height = `${shot.sheetHeight ?? 420}px`;
      const caption = document.createElement('figcaption');
      caption.textContent = `${shot.file}: ${shot.about}`;
      figure.append(img, caption);
      grid.append(figure);
    }
    await Promise.all([...document.images].map(img => (img.complete ? null : new Promise(done => { img.onload = done; img.onerror = done; }))));
    window.__designReady = true;
  </script>
</body>
</html>
