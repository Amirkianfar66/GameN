<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- mothership:dev-only. The cinematic library's review gallery: synthetic fixtures only, never a client, kept out of production bundles. -->
<title>Cinematic gallery</title>
<style>
  :root { --ink: #151923; --paper: #F4EBDD; --gold: #F2C14E; --navy: #0B1020; --line: #2A3352; --muted: #A9B3C8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); color: var(--paper); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 16px; border-bottom: 2px solid var(--gold); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .viewer { background: #05070B; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 320px; position: relative; }
  .viewer iframe { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .controls, .panel { background: #121935; border: 2px solid var(--line); border-radius: 8px; padding: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
  select, button, input[type=range] { font: inherit; }
  select, button { background: var(--ink); color: var(--paper); border: 2px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 36px; }
  button:hover, select:hover { border-color: var(--gold); }
  button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .time { font-variant-numeric: tabular-nums; color: var(--gold); min-width: 120px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 2px solid currentColor; }
  .badge--approved { color: #6FE3B0; } .badge--pilot { color: var(--gold); } .badge--proposal { color: #BFA8FF; } .badge--not { color: #FF9C8A; }
  .log { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #05070B; border-radius: 6px; padding: 8px; height: 140px; overflow: auto; white-space: pre-wrap; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 8px; color: var(--gold); }
  .exports { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 0 16px 24px; }
  .export { background: #121935; border: 2px solid var(--line); border-radius: 8px; padding: 8px; }
  .export video, .export img { width: 100%; border-radius: 4px; background: #000; display: block; }
  .export p { margin: 6px 0 0; font-size: 12px; color: var(--muted); word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; } td, th { text-align: left; padding: 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
</style>
</head>
<body>
<header>
  <h1>Cinematic library · review gallery</h1>
  <p>Synthetic fixtures (board-v2 review page). Development only: not a client and never bundled.</p>
</header>
<main>
  <section>
    <div class="viewer" id="viewer" aria-label="Stage"></div>
    <div class="controls" style="margin-top: 12px">
      <div class="row">
        <button id="play" type="button" aria-pressed="false">Play</button>
        <button id="back" type="button" aria-label="Back one frame">−1 frame</button>
        <button id="fwd" type="button" aria-label="Forward one frame">+1 frame</button>
        <span class="time" id="time">0 / 0 ms</span>
        <span id="status"></span>
      </div>
      <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Time">
    </div>
  </section>
  <aside>
    <div class="panel">
      <h2>Scene</h2>
      <div class="row">
        <label>Pilot <select id="pilot"></select></label>
        <label>Surface <select id="surface"></select></label>
        <label>Variant <select id="variant"></select></label>
        <label>Case <select id="case"><option>entrance</option><option>talk</option><option>exit</option></select></label>
        <label>Phone <select id="size"><option value="390x844">390 × 844</option><option value="320x568">320 × 568</option></select></label>
      </div>
      <div class="row"><button id="reduced" type="button" aria-pressed="false">Reduced motion (switch mid-film)</button></div>
    </div>
    <div class="panel" style="margin-top: 12px">
      <h2>Event lifecycle (simulated server clock)</h2>
      <div class="row">
        <button id="deliver" type="button">Deliver event</button>
        <button id="duplicate" type="button">Duplicate id</button>
        <button id="late" type="button">Late join (+2.5 s)</button>
        <button id="cancel" type="button">Cancel (newer snapshot)</button>
        <button id="reconnect" type="button">Reconnect after end</button>
        <button id="hidden" type="button">Hide tab 1.5 s</button>
      </div>
      <div class="log" id="log" role="log" aria-live="polite"></div>
    </div>
    <div class="panel" style="margin-top: 12px">
      <h2>Audience and status</h2>
      <div id="audience"></div>
    </div>
  </aside>
</main>
<h2 style="padding: 0 16px">Exports (from design/cinematic/exports/manifest.json)</h2>
<div class="exports" id="exports"></div>
<script type="module" src="./gallery.mjs"></script>
</body>
</html>
