<!doctype html>
<!-- mothership:dev-only. The crew drawing release's review page (design/crew-drawing/review.mjs): ?view=motion (&reduced=1) or ?view=compare. A design review page, not the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew drawing release</title>
<style>
  :root { --ink: #151923; --paper: #F4EBDD; --shade: #E3D6C2; --night: #12141B; --steel: #34415A; --amber: #F2C14E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* ---------- motion: nine on a noir stage, 1280 x 720 ---------- */
  html[data-view="motion"] body { background: var(--night); overflow: hidden; }
  .stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: radial-gradient(ellipse 70% 60% at 50% 40%, #2A2E3B 0%, #171A23 60%, #0E1016 100%); }
  .floor { position: absolute; left: 0; right: 0; top: 548px; height: 2px; background: #F2C14E22; }
  .col { position: absolute; top: 0; width: 136px; height: 720px; }
  .spot { position: absolute; left: 3px; top: 170px; width: 130px; height: 420px; background: radial-gradient(ellipse 50% 50% at 50% 55%, #F2C14E1F 0%, #F2C14E08 45%, transparent 70%); }
  .actor { position: absolute; left: -62px; top: 238px; width: 260px; height: 260px; will-change: transform, opacity; }
  .actor > * { position: absolute; inset: 0; }
  .actor svg { width: 100%; height: 100%; display: block; }
  .actor[data-mirror="true"] > * { transform: scaleX(-1); }
  .who { position: absolute; left: 0; right: 0; top: 600px; text-align: center; color: #E9E2D4; font-size: 17px; font-weight: 700; }
  .what { position: absolute; left: 2px; right: 2px; top: 624px; text-align: center; color: #E9E2D4AA; font-size: 12.5px; line-height: 1.25; }
  .caption { position: absolute; top: 34px; left: 0; right: 0; text-align: center; color: var(--amber); font: 800 25px/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
  .sub { position: absolute; top: 72px; left: 0; right: 0; text-align: center; color: #E9E2D4BB; font-size: 15px; }
  .mark { position: absolute; right: 16px; bottom: 10px; color: #E9E2D466; font-size: 12px; }
  .clock { position: absolute; left: 16px; bottom: 10px; color: #E9E2D466; font: 12px/1 ui-monospace, monospace; }
  /* ---------- compare: old and new, surface by surface ---------- */
  header { padding: 22px 28px 4px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  header p { margin: 0; max-width: 1180px; }
  section { padding: 8px 28px 14px; border-top: 1px solid #0001; }
  h2 { font-size: 17px; margin: 8px 0 8px; }
  .pair { display: grid; grid-template-columns: 72px 1fr; gap: 6px 10px; align-items: center; }
  .pair > b { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
  .strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .cell { position: relative; text-align: center; font-size: 11.5px; }
  .cell small { display: block; opacity: 0.7; max-width: 130px; }
  .fig { position: relative; background: #E9DDC8; border-radius: 6px; overflow: hidden; }
  .fig.dark { background: #2B3140; }
  .fig > * { position: absolute; inset: 0; }
  .fig svg { width: 100%; height: 100%; display: block; }
  .crop-who { width: 30px; height: 30px; border-radius: 50%; background: #1D2F4A 50% 22% / 175% auto no-repeat; border: 2px solid #D9A63A; box-shadow: 0 0 0 1.5px var(--ink); }
  .crop-chip { position: relative; width: 52px; height: 52px; border-radius: 50%; background: #E9DCC3; }
  .crop-chip i { position: absolute; inset: 14%; border-radius: 50%; overflow: hidden; background: #DCCDB2 50% 22% / 175% auto no-repeat; }
  .crop-cast { width: 30px; height: 34px; background: center / contain no-repeat; }
  .crop-option { width: 80px; aspect-ratio: 84 / 96; background: center / contain no-repeat; }
  .crop-slot { width: 52px; aspect-ratio: 84 / 96; background: center / contain no-repeat; }
  .crop-photo { position: relative; width: 104px; aspect-ratio: 104 / 134; background: var(--paper); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 3px 4px 0 rgb(21 25 35 / 0.35); }
  .crop-photo i { position: absolute; left: 9.6%; top: 7.5%; width: 76.9%; height: 68.7%; overflow: hidden; background: #2A2E3B center bottom / cover no-repeat; }
  .crop-role { position: relative; display: block; width: 88px; aspect-ratio: 50 / 53; overflow: hidden; background: radial-gradient(circle at 2px 2px, #CBBBA2 1.3px, transparent 1.6px) 0 0 / 7px 7px, #E3D6C2; border: 2px solid var(--ink); border-radius: 6px; }
  .crop-role::before { content: ""; position: absolute; top: 6%; left: 11.3%; width: 66.5%; aspect-ratio: 84 / 96; rotate: -2.5deg; background: var(--person) center / contain no-repeat; }
  .crop-role::after { content: ""; position: absolute; bottom: -10%; right: -9%; width: 74%; aspect-ratio: 120 / 140; background: var(--device) center / contain no-repeat; }
  .crop-standee { width: 96px; height: 120px; background: center / contain no-repeat; }
  .icon svg { width: 96px; height: 96px; display: block; }
  .note { font-size: 13px; opacity: 0.75; margin: 6px 0 0; max-width: 1180px; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="./review.mjs"></script>
</body>
</html>
