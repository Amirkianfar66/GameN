<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · exploration drawing · role device: Undercover (Red team)
  mothership:dev-only. Not an asset, in no bundle, never connected. Drawn for the comic-board
  exploration (design/explorations/comic-board/).

  PRIVATE. A role is shown as a device added to the player's own character, and only on that
  player's own screen, inside the private card. It is never drawn on a piece on the board,
  on the shared display or in a public cue. Every phone would load all nine, whatever its role.

  It says: a field to give to someone. An emitter with a dome over it. The dome is this role and nobody else sees it.

  The hand and sleeve are the crew suit every character wears, so one drawing serves all nine
  characters. The accent is the team color, allowed here because the view is private.
  No text is drawn. 120 x 140; laid over the lower right of the character.
  Parts the page may move: device-undercover-glow (its lights), device-undercover-head (the device), device-undercover-arm (hand and sleeve).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <pattern id="device-undercover-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.85" fill="#151923"/>
    </pattern>
  </defs>
  <g id="device-undercover-all">
    <g id="device-undercover-arm">
      <polygon points="64,103 92,97 126,150 80,150" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="84,118 98,107 126,150 100,150" fill="url(#device-undercover-dots)" opacity="0.6"/>
      <polygon points="64.5,104 92,98 96.5,105.5 69,112" fill="#FF8C8C" stroke="#151923" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="device-undercover-head">
      <rect x="66" y="56" width="12" height="60" rx="4" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <path d="M69.5 60 V72" fill="none" stroke="#8696AE" stroke-width="2" stroke-linecap="round"/>
      <g id="device-undercover-glow" fill="none" stroke="#FF8C8C" stroke-linecap="round"><path d="M46 31 Q72 -6 98 31" stroke-width="3"/><path d="M54 30 Q72 5 90 30" stroke-width="2.4"/><path d="M62 29 Q72 16 82 29" stroke-width="2"/></g>
      <rect x="67" y="42" width="10" height="18" rx="3" fill="#55657E" stroke="#151923" stroke-width="2.6"/>
      <ellipse cx="72" cy="41" rx="27" ry="9.5" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <ellipse cx="72" cy="37.5" rx="27" ry="9.5" fill="#B9C4D3" stroke="#151923" stroke-width="3"/>
      <ellipse cx="72" cy="36.5" rx="13" ry="4.4" fill="#FF8C8C" stroke="#151923" stroke-width="2.2"/>
      <path d="M50 35.5 Q56 31 64 30" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/>
      <g fill="#151923"><circle cx="52" cy="40" r="1.5"/><circle cx="92" cy="40" r="1.5"/><circle cx="72" cy="44.6" r="1.5"/></g>
    </g>
    <g id="device-undercover-fist">
      <path d="M55 84 Q55 75 64 75 H81 Q90 75 90 85 V98 Q90 107 81 107 H64 Q55 107 55 98 Z" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 76 H82 Q90 76 90 85 V98 Q90 107 82 107 H76 Q82 92 78 76 Z" fill="url(#device-undercover-dots)" opacity="0.55"/>
      <path d="M59 84.5 H78 M59 91.5 H78 M59 98.5 H78" fill="none" stroke="#151923" stroke-width="1.9" stroke-linecap="round"/>
      <rect x="52" y="69" width="26" height="11" rx="5.5" fill="#C6CDD4" stroke="#151923" stroke-width="2.8" transform="rotate(-10 65 74.5)"/>
    </g>
  </g>
</svg>
