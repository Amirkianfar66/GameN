<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · exploration drawing · role device: Insider (Blue team)
  mothership:dev-only. Not an asset, in no bundle, never connected. Drawn for the comic-board
  exploration (design/explorations/comic-board/).

  PRIVATE. A role is shown as a device added to the player's own character, and only on that
  player's own screen, inside the private card. It is never drawn on a piece on the board,
  on the shared display or in a public cue. Every phone would load all nine, whatever its role.

  It says: three, and not which is which. A slate showing three marks that are exactly alike.

  The hand and sleeve are the crew suit every character wears, so one drawing serves all nine
  characters. The accent is the team color, allowed here because the view is private.
  No text is drawn. 120 x 140; laid over the lower right of the character.
  Parts the page may move: device-insider-glow (its lights), device-insider-head (the device), device-insider-arm (hand and sleeve).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <pattern id="device-insider-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.85" fill="#151923"/>
    </pattern>
  </defs>
  <g id="device-insider-all">
    <g id="device-insider-arm">
      <polygon points="64,103 92,97 126,150 80,150" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="84,118 98,107 126,150 100,150" fill="url(#device-insider-dots)" opacity="0.6"/>
      <polygon points="64.5,104 92,98 96.5,105.5 69,112" fill="#70AFFF" stroke="#151923" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="device-insider-head">
      <rect x="66" y="56" width="12" height="60" rx="4" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <path d="M69.5 60 V72" fill="none" stroke="#8696AE" stroke-width="2" stroke-linecap="round"/>
      <rect x="40" y="2" width="64" height="62" rx="9" fill="#B9C4D3" stroke="#151923" stroke-width="3"/>
      <path d="M94 4 Q104 5 104 12 V54 Q104 62 95 64 H86 Q96 40 94 4 Z" fill="url(#device-insider-dots)" opacity="0.5"/>
      <rect x="45.5" y="7.5" width="53" height="47" rx="5" fill="#222B3A" stroke="#151923" stroke-width="2.4"/>
      <g fill="#F4EBDD"><circle cx="56.5" cy="24" r="5"/><path d="M48.5 42 Q48.5 31.5 56.5 31.5 Q64.5 31.5 64.5 42 Z"/><circle cx="72" cy="24" r="5"/><path d="M64 42 Q64 31.5 72 31.5 Q80 31.5 80 42 Z"/><circle cx="87.5" cy="24" r="5"/><path d="M79.5 42 Q79.5 31.5 87.5 31.5 Q95.5 31.5 95.5 42 Z"/></g>
      <path id="device-insider-glow" d="M48 47.5 H96" fill="none" stroke="#70AFFF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M49 20 L60 9.5 H66 L49 27 Z" fill="#F4EBDD" opacity="0.14"/>
      <circle cx="72" cy="59.5" r="2.4" fill="#34415A" stroke="#151923" stroke-width="1.4"/>
    </g>
    <g id="device-insider-fist">
      <path d="M55 84 Q55 75 64 75 H81 Q90 75 90 85 V98 Q90 107 81 107 H64 Q55 107 55 98 Z" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <path d="M78 76 H82 Q90 76 90 85 V98 Q90 107 82 107 H76 Q82 92 78 76 Z" fill="url(#device-insider-dots)" opacity="0.55"/>
      <path d="M59 84.5 H78 M59 91.5 H78 M59 98.5 H78" fill="none" stroke="#151923" stroke-width="1.9" stroke-linecap="round"/>
      <rect x="52" y="69" width="26" height="11" rx="5.5" fill="#C6CDD4" stroke="#151923" stroke-width="2.8" transform="rotate(-10 65 74.5)"/>
    </g>
  </g>
</svg>
