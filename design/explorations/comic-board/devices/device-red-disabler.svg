<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · exploration drawing · role device: Red Disabler (Red team)
  mothership:dev-only. Not an asset, in no bundle, never connected. Drawn for the comic-board
  exploration (design/explorations/comic-board/).

  PRIVATE. A role is shown as a device added to the player's own character, and only on that
  player's own screen, inside the private card. It is never drawn on a piece on the board,
  on the shared display or in a public cue. Every phone would load all nine, whatever its role.

  It says: one use. A prod with a single charge ring.

  The hand and sleeve are the crew suit every character wears, so one drawing serves all nine
  characters. The accent is the team color, allowed here because the view is private.
  No text is drawn. 120 x 140; laid over the lower right of the character.
  Parts the page may move: device-red-disabler-glow (its lights), device-red-disabler-head (the device), device-red-disabler-arm (hand and sleeve).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <pattern id="device-red-disabler-dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.85" fill="#151923"/>
    </pattern>
  </defs>
  <g id="device-red-disabler-all">
    <g id="device-red-disabler-arm">
      <polygon points="64,103 92,97 126,150 80,150" fill="#C6CDD4" stroke="#151923" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="84,118 98,107 126,150 100,150" fill="url(#device-red-disabler-dots)" opacity="0.6"/>
      <polygon points="64.5,104 92,98 96.5,105.5 69,112" fill="#FF8C8C" stroke="#151923" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="device-red-disabler-head">
      <rect x="66" y="56" width="12" height="60" rx="4" fill="#34415A" stroke="#151923" stroke-width="3"/>
      <path d="M69.5 60 V72" fill="none" stroke="#8696AE" stroke-width="2" stroke-linecap="round"/>
      <rect x="67.5" y="20" width="9" height="40" rx="3" fill="#8696AE" stroke="#151923" stroke-width="2.8"/>
      <path d="M66.5 24 L60.5 5 H66.5 L71 19 Z M77.5 24 L83.5 5 H77.5 L73 19 Z" fill="#B9C4D3" stroke="#151923" stroke-width="2.6" stroke-linejoin="round"/>
      <g id="device-red-disabler-glow"><path d="M64 9 L68.5 4.5 L71 10 L74.5 3.5 L80 9" fill="none" stroke="#FF8C8C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="72" cy="38" rx="10.5" ry="4" fill="#FF8C8C" stroke="#151923" stroke-width="2.4"/></g>
      <path d="M70 26 V34" fill="none" stroke="#F4EBDD" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="72" cy="62" rx="15" ry="4.6" fill="#34415A" stroke="#151923" stroke-width="2.8"/>
      <path d="M60 61 Q72 57.5 84 61" fill="none" stroke="#8696AE" stroke-width="1.8" stroke-linecap="round"/>
