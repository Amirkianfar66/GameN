      <rect x="54" y="38" width="48" height="22" rx="7" fill="none" stroke="#151923" stroke-width="3"/>
      <g id="device-cracker-glow"><rect x="60" y="19" width="13" height="21" rx="5" fill="#70AFFF" stroke="#151923" stroke-width="2.6"/><path d="M63.6 24 V33" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/><rect x="81" y="19" width="13" height="21" rx="5" fill="#70AFFF" stroke="#151923" stroke-width="2.6"/><path d="M84.6 24 V33" fill="none" stroke="#F4EBDD" stroke-width="2" stroke-linecap="round"/></g>
      <rect x="62" y="14.5" width="9" height="6" rx="2" fill="#34415A" stroke="#151923" stroke-width="2"/><rect x="83" y="14.5" width="9" height="6" rx="2" fill="#34415A" stroke="#151923" stroke-width="2"/>
      <circle cx="68" cy="49" r="7" fill="#222B3A" stroke="#151923" stroke-width="2"/>
