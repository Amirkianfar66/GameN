<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mothership · exploration drawing · Room B
  mothership:dev-only. Not an asset, in no bundle, never connected. Drawn for the comic-board
  exploration (design/explorations/comic-board/), in the frame and the drawing vocabulary
  of design/source/board/board-room-a.svg so that it can become a source if the look is kept.

  Room B as one comic panel: a work bay with a long bench, a wall screen showing a diagram,
  shelves of bottles and a slit window. Its silhouette is the bench and the screen, where
  Room A's is the round viewport.

  No text is drawn and no door, corridor or arrow leads out of the picture: the artwork
  says nothing about which rooms connect. It is drawn in the neutral steel palette; the
  exploration page swaps the five steel values for the room's own color family.

  Layers, back to front: room-b-space, room-b-backwall, room-b-shell, room-b-floor, room-b-edges, room-b-props-back, room-b-props-front, room-b-frame
-->
